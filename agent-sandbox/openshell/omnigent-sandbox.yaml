# Omnigent SERVER config fragment (merge into the server's own config.yaml, e.g.
# `omnigent server -c config.yaml` or <data_dir>/config.yaml). Not an agent bundle like
# .omnigent/*/config.yaml.
#
# The server process also needs OpenShell gateway access: run `openshell gateway select
# <name>` where the server runs, or set OPENSHELL_GATEWAY / `openshell.cluster` below.
sandbox:
  provider: openshell
  # Must be reachable FROM the sandbox and allowed in policy.yaml's `omnigent-server` entry.
  server_url: https://your-omnigent-host.example.com
  openshell:
    image: ghcr.io/tonylibs/dws-agent-sandbox:openshell
    # Server env var NAMES copied into each sandbox; every name must be set in the
    # server environment. One credential per .omnigent/ harness and MCP server:
    #   claude-sdk  ANTHROPIC_API_KEY (or swap in CLAUDE_CODE_OAUTH_TOKEN)
    #   codex       OPENAI_API_KEY
    #   copilot     COPILOT_GITHUB_TOKEN
    #   antigravity GEMINI_API_KEY
    #   github MCP  GITHUB_PERSONAL_ACCESS_TOKEN
    #   git clone   GIT_TOKEN
    # Set OMNIGENT_RUNNER_ENV_PASSTHROUGH in the server environment to
    #   https_proxy,http_proxy,HTTPS_PROXY,HTTP_PROXY,NO_PROXY,no_proxy,COPILOT_GITHUB_TOKEN,GITHUB_PERSONAL_ACCESS_TOKEN
    # The proxy vars fix "Temporary failure in name resolution" in the runner; the two
    # token names are outside the host's default credential forwarding set.
    env:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - COPILOT_GITHUB_TOKEN
      - GEMINI_API_KEY
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - GIT_TOKEN
      - OMNIGENT_RUNNER_ENV_PASSTHROUGH
    # cluster: openshell   # default: the active gateway
