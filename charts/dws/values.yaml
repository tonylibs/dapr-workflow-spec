# Default values for dws.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace to deploy into. Defaults to the release namespace when empty.
namespaceOverride: ""

# Chart-wide globals. security.allowInsecureImages lets the Bitnami postgresql subchart
# run the relocated docker.io/bitnamilegacy image (see postgresql.image below); it has no
# effect when postgresql.enabled is false.
global:
  security:
    allowInsecureImages: true

# Dapr control plane, provided by the upstream dapr/dapr chart as a conditional dependency
# (see Chart.yaml). When true (the default), the chart installs Dapr as part of the release
# and the admin Deployment's dapr.io/* annotations and DAPR_* env vars render. When false, no
# Dapr control-plane resources are installed by this chart and a preflight check fails
# install/upgrade unless Dapr CRDs are already present in the cluster (i.e. Dapr is managed
# externally).
dapr:
  enabled: true
  # Sidecar injection is a one-shot decision the dapr-sidecar-injector's mutating webhook
  # makes at Pod creation time. In a plain `helm install` with dapr.enabled=true, Dapr's own
  # control plane and the admin Deployment are created in the same atomic apply, so there is
  # no guarantee the injector's webhook is actually serving yet when the admin Pod is
  # admitted — a missed injection never recovers on its own (a container restart doesn't
  # re-run admission). This post-install/post-upgrade hook Job waits for the injector
  # rollout, then deletes the admin Pod if it ended up without its daprd sidecar so it gets
  # recreated correctly. Only runs when dapr.enabled is true.
  readyHook:
    image:
      repository: docker.io/alpine/k8s
      tag: "1.31.1"
      pullPolicy: IfNotPresent

# dws-controller control plane (Phase 2). Toggle the whole stack with controller.enabled.
controller:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/tonylibs/dws-controller
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 80
  # Step-image references the controller stamps into per-workflow resources
  # (rendered as DWS_IMAGES_* env vars on the controller container).
  images:
    callHttp: ghcr.io/tonylibs/dws-call-http:latest
    callOpenapi: ghcr.io/tonylibs/dws-call-openapi:latest
    run: sw-run:1.0
    orchestrator: ghcr.io/tonylibs/dws-orchestrator:latest

# dws-admin read model service. Toggle the whole stack with admin.enabled.
admin:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/tonylibs/dws-admin
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  # Database connection. When postgresql.enabled is true (default), DATABASE_URL is
  # resolved automatically from the in-chart Postgres — leave these unset. Set one of
  # the two below only when postgresql.enabled is false (external/managed database):
  #   database.url: a literal connection string admin owns as its own Secret
  #   database.existingSecret/existingSecretKey: an operator-provided Secret/key
  database:
    url: ""
    existingSecret: ""
    existingSecretKey: ""
  pubsub:
    name: pubsub
    topic: dws.events

# In-chart Postgres backing dws-admin's read model (dev/eval-grade), provided by the
# upstream Bitnami postgresql subchart. Set postgresql.enabled to false to point admin at
# an external/managed database instead. Values here flow straight into the subchart —
# see https://github.com/bitnami/charts/tree/main/bitnami/postgresql for the full schema.
postgresql:
  enabled: true
  # Single-node dev/eval deployment.
  architecture: standalone
  # Bitnami relocated its free container images out of docker.io/bitnami; the tags this
  # chart version pins now live under docker.io/bitnamilegacy. Point the image there and
  # allow the non-default repository (see global.security.allowInsecureImages below).
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: dws
    password: dws
    database: dws_admin
  primary:
    persistence:
      size: 1Gi
    # kind/dev clusters: skip the default-on NetworkPolicy so admin can reach Postgres freely.
    networkPolicy:
      enabled: false

# Image pull secrets, applied to the admin (and other component) pods that reference
# private registries. More info: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# Overrides for the chart name / fully-qualified name used to derive component resource names.
nameOverride: ""
fullnameOverride: ""
