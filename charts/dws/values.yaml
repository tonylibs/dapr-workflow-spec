# Default values for dws.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Namespace to deploy into. Defaults to the release namespace when empty.
namespaceOverride: ""

# Chart-wide globals. security.allowInsecureImages lets the Bitnami postgresql AND redis
# subcharts run the relocated docker.io/bitnamilegacy images (see postgresql.image and
# redis.image below); it has no effect when both subcharts are disabled.
global:
  security:
    allowInsecureImages: true

# Defaults for every chart-owned Deployment (controller, admin, and console).
# Component `resources`, `nodeSelector`, and `affinity` maps deep-merge with these defaults;
# a non-empty component `tolerations` list replaces defaults.tolerations. Override only the
# settings that differ for a component. PostgreSQL is an upstream StatefulSet subchart, so its
# equivalent fields remain under postgresql.primary rather than this template helper.
defaults:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Dapr control plane, provided by the upstream dapr/dapr chart as a conditional dependency
# (see Chart.yaml). When true (the default), the chart installs Dapr as part of the release.
# When false, no Dapr control-plane resources are installed by this chart and a preflight check fails
# install/upgrade unless Dapr CRDs are already present in the cluster (i.e. Dapr is managed
# externally).
dapr:
  enabled: true
  # Sidecar injection is a one-shot decision the dapr-sidecar-injector's mutating webhook
  # makes at Pod creation time. In a plain `helm install` with dapr.enabled=true, Dapr's own
  # control plane and the admin Deployment are created in the same atomic apply, so there is
  # no guarantee the injector's webhook is actually serving yet when the admin Pod is
  # admitted — a missed injection never recovers on its own (a container restart doesn't
  # re-run admission). This post-install/post-upgrade hook Job waits for the injector
  # rollout, then deletes the admin Pod if it ended up without its daprd sidecar so it gets
  # recreated correctly. Only runs when dapr.enabled is true.
  readyHook:
    image:
      repository: docker.io/alpine/k8s
      tag: "1.31.1"
      pullPolicy: IfNotPresent

# dws-controller control plane (Phase 2). Toggle the whole stack with controller.enabled.
# The controller does not expose an Ingress: it only makes outbound Dapr calls and has no
# browser-facing API. Its ClusterIP Service remains available for in-cluster clients.
controller:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/tonylibs/dws-controller
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Step-image references the controller stamps into per-workflow resources
  # (rendered as DWS_IMAGES_* env vars on the controller container).
  images:
    callHttp: ghcr.io/tonylibs/dws-call-http:latest
    callOpenapi: ghcr.io/tonylibs/dws-call-openapi:latest
    run: sw-run:1.0
    orchestrator: ghcr.io/tonylibs/dws-orchestrator:latest

# Dapr-native JWT authentication for the controller (dws-console auth roadmap Phase 2,
# docs/roadmaps/dws-auth.md). Off by default so existing releases keep working; enabling
# switches the controller Service to front the Dapr sidecar port (3500) so no caller can
# bypass the middleware by hitting the app port directly.
#
# Two configuration modes:
#
#   (a) External OIDC (production shape):
#       auth.enabled=true
#       auth.issuer=https://idp.example.com          # OIDC discovery root
#       auth.audience=dws-controller                 # `aud` claim the token must carry
#       auth.jwksURL=https://idp.example.com/keys    # optional; discovered from issuer when unset
#
#   (b) In-chart Dex (dev/quickstart, requires dex.enabled=true):
#       auth.enabled=true
#       auth.dex.enabled=true
#       # issuer / audience / jwksURL are derived from the Dex config; do not set them.
#
# Enabling auth.enabled without either (a) or (b) fails render with an explicit error.
auth:
  enabled: false
  issuer: ""
  audience: ""
  jwksURL: ""
  dex:
    enabled: false

# Apache APISIX (auth roadmap §2b, docs/roadmaps/dws-auth.md): the optional Gateway API data
# plane + ingress controller backing the shared console/admin front door (see apiGateway below).
# Off by default — apisix.enabled only controls whether THIS chart installs its own bundled
# APISIX; it is independent from apiGateway.enabled, which controls whether DWS's own
# GatewayClass/Gateway/HTTPRoutes render at all. That split lets an operator point
# apiGateway.enabled=true at an externally managed APISIX/Gateway API controller instead
# (see apiGateway.external.gatewayProxyName) without this chart ever assuming a platform-wide
# APISIX install. Values under apisix.* flow straight into the upstream apache/apisix-helm-chart
# subchart (https://github.com/apache/apisix-helm-chart/tree/apisix-2.16.0/charts/apisix) — the
# nested ingress-controller block configures that subchart's own bundled apisix-ingress-controller
# child the same way.
#
# IMPORTANT for migrating an EXISTING release: apisix.enabled=true only self-bootstraps its CRDs
# and bundled etcd on a brand-new `helm install`; flipping it on via `helm upgrade` on a release
# that never had it deadlocks (see the apiGateway comment block below for why, and
# charts/dws/README.md#upgrading-from-a-pre-gateway-release for the verified recipe).
apisix:
  enabled: false
  service:
    type: ClusterIP
    # The upstream apisix subchart's own default (externalTrafficPolicy: Cluster) is only valid
    # for NodePort/LoadBalancer Services; left at that default alongside type: ClusterIP above,
    # a real API server rejects the rendered Service outright ("may only be set for
    # externally-accessible services") — this was never caught by helm lint/template (which
    # don't run Kubernetes' apimachinery validation) and only surfaces on a live install. Clear
    # it here so a plain `apisix.enabled=true` bundled install actually deploys.
    externalTrafficPolicy: ""
  # apisix-ingress-controller is APISIX's own conditional child dependency (Gateway API
  # reconciliation). Keep it enabled whenever apisix.enabled=true — DWS's Gateway/HTTPRoute
  # objects have no controller to reconcile them otherwise.
  ingress-controller:
    enabled: true
    config:
      disableGatewayAPI: false
      listenerPortMatchMode: auto
    gatewayProxy:
      # DWS owns creating its own release/namespace-qualified GatewayProxy
      # (templates/api-gateway/gatewayproxy.yaml) rather than using the ingress-controller's
      # single implicit default, so two DWS releases in the same cluster don't collide.
      createDefault: false

# apiGateway (auth roadmap §2b, docs/roadmaps/dws-auth.md): the shared Kubernetes Gateway API
# front door for dws-console and dws-admin, superseding the old chart-bundled nginx
# admin-gateway and the console's plain Ingress. Off by default so `helm upgrade` is a
# topological no-op unless the operator opts in. When enabled, requires auth.enabled=true,
# admin.enabled=true, and console.enabled=true — the Gateway has no admin bearer middleware or
# backend to route to otherwise.
#
# Two operating modes, selected by apisix.enabled above:
#   (a) Bundled APISIX (apisix.enabled=true): this chart creates its own namespaced
#       GatewayProxy bound to the bundled APISIX control plane's admin API.
#   (b) External APISIX (apisix.enabled=false): apiGateway.external.gatewayProxyName MUST name
#       an existing GatewayProxy managed outside this chart; a render-time preflight check
#       requires Gateway API v1 and APISIX apisix.apache.org/v1alpha1 CRDs to already be present
#       (see templates/_preflight.tpl).
#
# MIGRATING AN EXISTING RELEASE (verified live, see charts/dws/README.md#upgrading-from-a-pre-
# gateway-release and scripts/verify-console-ingress-migration.sh): mode (a), bundled APISIX,
# can ONLY be turned on via a brand-new `helm install`. Enabling apisix.enabled=true via
# `helm upgrade` on a release that never had it before deadlocks on the bundled Bitnami-etcd
# sub-chart's `pre-upgrade` hook — that hook requires a JWT Secret that only the main manifest
# sync (which never runs, because the hook blocks first) would create, and Helm never re-applies
# a subchart's crds/ directory on upgrade in the first place. This never surfaces in
# `helm template`/`helm lint`, only on a real cluster. For an EXISTING release migrating off
# console.ingress.enabled=true, use mode (b) instead: install APISIX as its own separate Helm
# release first, then point apiGateway.external.gatewayProxyName at a GatewayProxy bound to it.
apiGateway:
  enabled: false
  # Whether this chart creates the (cluster-scoped) GatewayClass. Set to false and provide
  # gatewayClassName to attach to an operator-owned GatewayClass instead — useful when another
  # release or platform team already owns one APISIX-controller GatewayClass per cluster.
  createGatewayClass: true
  # Explicit GatewayClass name. Required when createGatewayClass=false. When createGatewayClass
  # is true and this is left empty, the chart derives a release-and-namespace-qualified name
  # (see dws.apiGateway.className in _helpers.tpl) so multiple releases/namespaces never collide
  # on the one cluster-scoped GatewayClass resource.
  gatewayClassName: ""
  # The APISIX ingress controller's registered controllerName. Only change this if a different
  # APISIX ingress-controller release/version registers under another name.
  controllerName: apisix.apache.org/apisix-ingress-controller
  # Public hostname the Gateway listener answers on. Left empty, the listener has no hostname
  # restriction (matches any Host header) — set this for a real deployment alongside TLS below.
  hostname: ""
  tls:
    enabled: false
    # Name of an existing Kubernetes TLS Secret (same namespace as the release) the Gateway's
    # HTTPS listener terminates with. Required when tls.enabled=true.
    certificateName: ""
  external:
    # Required when apisix.enabled=false: the name of an existing, externally managed APISIX
    # GatewayProxy (apisix.apache.org/v1alpha1) in the release namespace that the Gateway binds
    # to. Ignored when apisix.enabled=true (this chart creates its own).
    gatewayProxyName: ""

# admin-gateway is REMOVED (auth roadmap §2b). The chart-bundled nginx reverse proxy and its
# CORS preflight relay are superseded by the shared Gateway API front door above — see
# apiGateway.enabled and apisix.enabled. There is no adminGateway.* value contract anymore;
# any persisted adminGateway.* values are simply unrecognized/ignored by this chart version.

# dws-admin read model service. Toggle the whole stack with admin.enabled.
admin:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/tonylibs/dws-admin
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  # No admin.ingress block is rendered yet. The runtime-config shim must first let each
  # console install select its admin URL; until then, operators own any same-origin route.
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Database connection. When postgresql.enabled is true (default), DATABASE_URL is
  # resolved automatically from the in-chart Postgres — leave these unset. Set one of
  # the two below only when postgresql.enabled is false (external/managed database):
  #   database.url: a literal connection string admin owns as its own Secret
  #   database.existingSecret/existingSecretKey: an operator-provided Secret/key
  database:
    url: ""
    existingSecret: ""
    existingSecretKey: ""
  pubsub:
    name: pubsub
    topic: dws.events

# In-chart Postgres backing dws-admin's read model (dev/eval-grade), provided by the
# upstream Bitnami postgresql subchart. Set postgresql.enabled to false to point admin at
# an external/managed database instead. Values here flow straight into the subchart —
# see https://github.com/bitnami/charts/tree/main/bitnami/postgresql for the full schema.
postgresql:
  enabled: true
  # Single-node dev/eval deployment.
  architecture: standalone
  # Bitnami relocated its free container images out of docker.io/bitnami; the tags this
  # chart version pins now live under docker.io/bitnamilegacy. Point the image there and
  # allow the non-default repository (see global.security.allowInsecureImages below).
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: dws
    password: dws
    database: dws_admin
  primary:
    # PostgreSQL is a StatefulSet from the upstream subchart, not a chart-owned Deployment.
    # Keep its scheduling shape aligned with defaults above; it cannot use the parent helper.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    persistence:
      size: 1Gi
    # kind/dev clusters: skip the default-on NetworkPolicy so admin can reach Postgres freely.
    networkPolicy:
      enabled: false

# dws-console web UI. Disabled by default: enable per install once you have a plan for how the
# browser will reach dws-admin (see the VITE_DWS_ADMIN_URL note below).
#
# VITE_DWS_ADMIN_URL and VITE_OIDC_* are Vite build args — Vite inlines them into the client bundle
# at build time, so their values are baked into the image (see dws-console/Dockerfile). They are NOT
# runtime environment variables: setting them on this Deployment has no effect. The published
# ghcr.io/tonylibs/dws-console image ships with the Dockerfile default `/dws-admin` and unset OIDC
# settings, which assume an ingress in front routes `/dws-admin/*` to the dws-admin Service.
# Operators needing split origins or in-chart Dex must rebuild the image, for example:
# `docker build --build-arg VITE_DWS_ADMIN_URL=https://admin.example
# --build-arg VITE_OIDC_ISSUER_URI=https://dex.example --build-arg VITE_OIDC_CLIENT_ID=dws-console .`
# A proper per-install runtime-config shim served by server.js is an open item on the helm-packaging
# roadmap.
console:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/tonylibs/dws-console
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # REMOVED (auth roadmap §2b): the chart-owned console Ingress template is gone, superseded by
  # the shared apiGateway Gateway API front door above (see apiGateway.enabled, apiGateway.hostname,
  # apiGateway.tls). ingress.enabled is kept ONLY as a deprecation trap — a leftover
  # console.ingress.enabled=true in a prior install's persisted values fails render/upgrade with
  # migration guidance (see dws.console.legacyIngress.validate in _helpers.tpl) rather than
  # silently dropping the route. There is no other console.ingress.* value; className/host/path/
  # annotations/tls all migrate onto apiGateway.hostname / apiGateway.tls instead.
  ingress:
    enabled: false

# Dex, an optional in-chart IdP for dws-console (auth roadmap Phase 0, docs/roadmaps/dws-auth.md),
# provided by the upstream dexidp/helm-charts "dex" chart as a conditional dependency (see
# Chart.yaml). Off by default: no consumer wires up to it until a later phase. When enabled, this
# chart renders Dex's entire config.yaml itself (configSecret.create: false, pointed at
# configSecret.name below) rather than using the subchart's static values passthrough, so the
# bootstrap admin's bcrypt hash can be computed in-template — see templates/dex/secrets.yaml.
dex:
  enabled: false
  # Dex's own issuer URL (OIDC discovery + token `iss` claim), must be reachable by dws-console
  # and any service validating tokens. This cluster-internal default only works for in-cluster
  # validation; override with a real externally-reachable URL for anything beyond local testing.
  issuer: "http://dex.dws.local/dex"
  # dws-console's registered OIDC redirect URI (public PKCE client, no client secret).
  # This MUST be the console's root URL, not a /callback sub-path: the console's OIDC client
  # completes the Authorization Code + PKCE exchange in place on the app's own root URL and then
  # restores the route the operator started from, so that root URL is the only redirect URI it
  # ever sends to Dex. Dex's browser CORS allowlist is derived from this URL's origin, keeping
  # discovery/token/key requests aligned with the registered redirect. The default matches the
  # console's dev server (`pnpm dev` → port 3000); override it with the console's real root URL for
  # any deployed install.
  consoleRedirectURI: "http://localhost:3000/"
  adminUser:
    # Bootstrap admin identity. The password is generated at install time and never rotated on
    # upgrade (see design.md) — never set a password here.
    email: admin@dws.local
    # Set to have the bootstrap password sourced from an operator-provided Secret instead of the
    # chart-generated one (mirrors admin.database.existingSecret above).
    existingSecret: ""
    existingSecretKey: ""
  # Points the dex subchart at the chart-rendered config Secret (templates/dex/secrets.yaml)
  # instead of building its own from a static values passthrough. Keep configSecret.name in sync
  # if overridden — both this value and that template must agree on the same Secret name.
  configSecret:
    create: false
    name: "dex-config"

# In-chart Redis backing the chart's three Dapr Redis Components (pubsub,
# dws-definitions, actor state store), provided by the upstream Bitnami redis subchart.
# There is NO independent redis.enabled toggle — the subchart's install lifecycle
# follows dapr.enabled (see Chart.yaml). Values here flow straight into the subchart —
# see https://github.com/bitnami/charts/tree/main/bitnami/redis for the full schema.
#
# External Redis: set redis.external.host to override the three Components'
# redisHost/redisPassword to point at an operator-managed Redis. The built-in Bitnami
# Redis subchart still installs alongside whenever Dapr is enabled — a documented
# trade-off (Helm dependency conditions cannot express "AND redis.external.host unset").
redis:
  # Single-node dev/eval deployment.
  architecture: standalone
  # Bitnami relocated its free container images out of docker.io/bitnami; the tags this
  # chart version pins now live under docker.io/bitnamilegacy. Point the image there and
  # allow the non-default repository (see global.security.allowInsecureImages).
  image:
    repository: bitnamilegacy/redis
  auth:
    password: dws
  master:
    persistence:
      size: 1Gi
    # kind/dev clusters: skip the default-on NetworkPolicy so Dapr Components can
    # reach Redis freely.
    networkPolicy:
      enabled: false
  # External Redis override. When external.host is non-empty, the three Dapr Component
  # templates use it (and external.existingSecret/existingSecretKey) instead of the
  # built-in Bitnami Redis. Leave empty (default) to use the in-chart Redis.
  external:
    host: ""
    existingSecret: ""
    existingSecretKey: "redis-password"

# Image pull secrets, applied to the admin (and other component) pods that reference
# private registries. More info: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# Overrides for the chart name / fully-qualified name used to derive component resource names.
nameOverride: ""
fullnameOverride: ""
