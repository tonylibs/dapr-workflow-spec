{{- if .Values.postgresql.enabled }}
{{- /*
  The Bitnami postgresql subchart owns the Postgres StatefulSet, Services, and its own
  credentials Secret. It does not emit a ready-to-use connection string, so this Secret
  composes the DATABASE_URL the admin Deployment consumes, built from the same
  postgresql.auth values passed to the subchart and the subchart's primary Service host.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dws.postgres.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  database-url: {{ printf "postgres://%s:%s@%s.%s.svc.cluster.local:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "dws.postgres.host" .) (include "dws.namespace" .) .Values.postgresql.auth.database | quote }}
{{- end }}
