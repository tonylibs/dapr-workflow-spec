{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dws.controller.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "dws.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dws.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ include "dws.controller.fullname" . | quote }}
        dapr.io/app-port: "8080"
        {{- /*
          One shared Configuration carries the auth pipeline, the observability tracing block,
          or both (templates/controller/configuration.yaml). dapr.io/config is single-valued, so
          this annotation follows EITHER feature toggle and can only ever name one resource.
        */}}
        {{- if or .Values.auth.enabled .Values.observability.enabled }}
        dapr.io/config: {{ include "dws.controller.configName" . | quote }}
        {{- end }}
        {{- /*
          OpenTelemetry Java agent injection, targeted at the `controller` container only — an
          untargeted annotation would make the Operator try to instrument the daprd sidecar too.
          Emits nothing when observability is disabled.
        */}}
        {{- with (include "dws.observability.podAnnotations" (dict "root" . "language" "java" "container" "controller")) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dws.controller.fullname" . }}
      {{- include "dws.component.scheduling" (dict "root" . "component" .Values.controller) | nindent 6 }}
      {{- if and .Values.dapr.enabled (not .Values.redis.external.host) }}
      initContainers:
        # The daprd sidecar's pubsub.redis Component init returns error
        # synchronously on a first connection-refused, so if the sidecar starts
        # before the in-chart Bitnami Redis is Ready it fatally exits (see
        # admin/deployment.yaml for the full explanation and CI evidence). Wait
        # for Redis's TCP port here so the sidecar comes up into a reachable
        # dependency set.
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              host_port='{{ include "dws.redis.host" . }}'
              host=${host_port%:*}
              port=${host_port##*:}
              until nc -z "$host" "$port"; do
                echo "waiting for redis $host:$port" >&2
                sleep 2
              done
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DWS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DWS_IMAGES_CALL_HTTP
              value: "{{ .Values.controller.images.callHttp.repository }}:{{ .Values.controller.images.callHttp.tag }}"
            - name: DWS_IMAGES_CALL_OPENAPI
              value: "{{ .Values.controller.images.callOpenapi.repository }}:{{ .Values.controller.images.callOpenapi.tag }}"
            - name: DWS_IMAGES_CALL_GRPC
              value: "{{ .Values.controller.images.callGrpc.repository }}:{{ .Values.controller.images.callGrpc.tag }}"
            - name: DWS_IMAGES_CALL_ASYNCAPI
              value: "{{ .Values.controller.images.callAsyncapi.repository }}:{{ .Values.controller.images.callAsyncapi.tag }}"
            - name: DWS_IMAGES_CALL_A2A
              value: "{{ .Values.controller.images.callA2a.repository }}:{{ .Values.controller.images.callA2a.tag }}"
            - name: DWS_IMAGES_RUN_SHELL
              value: "{{ .Values.controller.images.run.shell.repository }}:{{ .Values.controller.images.run.shell.tag }}"
            - name: DWS_IMAGES_RUN_SCRIPT_JS
              value: "{{ .Values.controller.images.run.scriptJs.repository }}:{{ .Values.controller.images.run.scriptJs.tag }}"
            - name: DWS_IMAGES_RUN_SCRIPT_PYTHON
              value: "{{ .Values.controller.images.run.scriptPython.repository }}:{{ .Values.controller.images.run.scriptPython.tag }}"
            - name: DWS_IMAGES_ORCHESTRATOR
              value: "{{ .Values.controller.images.orchestrator.repository }}:{{ .Values.controller.images.orchestrator.tag }}"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
          resources:
            {{- include "dws.component.resources" (dict "root" . "component" .Values.controller) | nindent 12 }}
{{- end }}
