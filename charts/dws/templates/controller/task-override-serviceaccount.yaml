{{- /*
Steps whose image has a controller.images.<step>.imagePullSecrets override run as this account.
It deliberately has no imagePullSecrets and no RBAC: the controller stamps the replacement list on
the step's Revision template, and Kubernetes would otherwise add this account's list to it. Always
rendered with the controller so adding or removing an override never creates or deletes an account
that active Revisions use.
*/}}
{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dws.task.overrideServiceAccountName" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: step
{{- end }}
