{{- /*
  Dapr actor/workflow state store, shared by every Dapr Workflow host in the namespace: each
  controller-compiled orchestrator and every activity-invoked step service registers as a
  workflow worker and needs it, so that daprd can start the actor runtime ("the state store is
  not configured to use the actor runtime" otherwise).
  Deliberately UNSCOPED. Dapr scopes list app ids, and a compiled workflow's app ids are its
  workflow name and its task names — unknown at chart time and different per workflow — so no
  static list can be right (the previous `scopes: [dws-orchestrator]` matched none of them). The
  controller does not edit this chart-owned object to track membership either: a shared object
  mutated per deploy races, needs update RBAC on a Helm-managed resource, and `helm upgrade`
  would revert it. Actor state is keyed by app id, so sharing the store does not mix tenants.
  The cost of being unscoped is that unrelated sidecars (admin, controller) also initialise a
  state.redis Component whose init issues CONFIG SET against Redis; `initTimeout` below keeps
  that inside the window for a still-warming Redis instead of Dapr's 5s default.
  Always rendered: `dapr.enabled=false` means "Dapr is externally managed, its CRDs are
  already in the cluster" (the preflight check enforces this), so a `dapr.io/v1alpha1`
  Component still applies cleanly. Only the chart-installed Dapr *control plane* is
  gated by `dapr.enabled`, not the Components consumed by that control plane.
*/}}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "dws.fullname" . }}-actor-statestore
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: actor-statestore
spec:
  type: state.redis
  version: v1
  # See pubsub-component.yaml — extend past Dapr's 5s default to survive the
  # Bitnami Redis 20s readiness-probe warmup window. state.redis also issues
  # CONFIG SET for keyspace notifications on init, which is Redis-side work
  # that particularly benefits from the wider window.
  initTimeout: 1m
  metadata:
    - name: redisHost
      value: {{ include "dws.redis.host" . | quote }}
    - name: redisPassword
      secretKeyRef:
        name: {{ include "dws.redis.secretName" . }}
        key: {{ include "dws.redis.secretKey" . }}
    - name: actorStateStore
      value: "true"
    - name: enableTLS
      value: "false"
auth:
  secretStore: kubernetes
