{{- /*
Dapr machine-auth token Secrets (auth roadmap Phase 10; openspec auth-phase-10-api-tokens D1/D2).

Rendered only with auth.enabled=true, one Secret per (component, kind), each skipped when the
operator names their own via auth.apiTokens.<component>.<kind>.existingSecret and when the owning
component is disabled:
  <release>-admin-dapr-api-token       admin sidecar API token (dapr.io/api-token-secret)
  <release>-admin-app-api-token        admin app token (dapr.io/app-token-secret)
  <release>-controller-dapr-api-token  controller sidecar API token (dapr.io/api-token-secret)
The controller's app token (kind appApi) is reserved for a follow-up change and not rendered.

Each Secret holds the token under the key `token`, which is Dapr's contract. The value is 48
random characters, minted once and then read back from the cluster on every upgrade (see
dws.apiTokens.value). It is readable by anyone who can read the Helm release Secret; supply an
existingSecret to keep a token out of Helm. Never printed by NOTES.txt or any test.
*/ -}}
{{- if .Values.auth.enabled }}
{{- range $token := list
      (dict "component" "admin" "kind" "daprApi" "enabled" .Values.admin.enabled)
      (dict "component" "admin" "kind" "appApi" "enabled" .Values.admin.enabled)
      (dict "component" "controller" "kind" "daprApi" "enabled" .Values.controller.enabled)
}}
{{- $ref := dict "root" $ "component" $token.component "kind" $token.kind }}
{{- if and $token.enabled (not (include "dws.apiTokens.existingSecret" $ref)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dws.apiTokens.generatedSecretName" $ref }}
  namespace: {{ include "dws.namespace" $ }}
  labels:
    {{- include "dws.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $token.component }}
type: Opaque
stringData:
  token: {{ include "dws.apiTokens.value" $ref | quote }}
{{- end }}
{{- end }}
{{- end }}
