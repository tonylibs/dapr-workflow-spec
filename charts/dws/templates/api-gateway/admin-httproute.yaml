{{- /*
Shared API Gateway (auth roadmap §2b): the admin HTTPRoute. Matches PathPrefix /dws-admin and
rewrites it to Dapr's service-invocation URL shape (/v1.0/invoke/<admin-app-id>/method), then
forwards to the admin Service — which in gateway mode (apiGateway.enabled=true) targets only the
Dapr sidecar's HTTP port 3500 (see templates/admin/service.yaml), forcing every browser-facing
admin request through the sidecar's bearer middleware before dws-admin's app code ever sees it.

Method, request body, query string, and Authorization/content headers are untouched by this
rule — Gateway API HTTPRoute forwarding is transparent for anything not named in `filters`, and
this rule adds only the URLRewrite filter and the one request-header filter below. No
response-buffering/transforming filter is configured, so SSE responses on this same path stream
through unmodified.

Dapr API token (auth roadmap Phase 10, openspec auth-phase-10-api-tokens D4): the admin sidecar
now requires a `dapr-api-token` header on every call, in addition to the bearer check. A
RequestHeaderModifier `set` (not `add`, so any client-supplied header is overwritten) injects it
here, and ONLY on this route -- the console route has no such filter, so the admin token is never
sent to the console. The value is an `$env://` reference that APISIX resolves from its own
environment (bundled: apisix.extraEnvVars + apisix.apisix.nginx.envs in values.yaml, enforced by
dws.apiGateway.validate; external: the operator exposes the same variable, see the chart README),
so the token never appears in this manifest. PENDING live spike (openspec tasks 1.1-1.3): that the
pinned apisix-ingress-controller merges this filter with URLRewrite into one proxy-rewrite
config, and that APISIX 3.17 resolves `$env://` in proxy-rewrite headers. No literal-token
fallback exists in this chart; if the spike fails, the design is revisited, not worked around.

Path-prefix matching ranks this rule ahead of the console's PathPrefix "/" rule
(console-httproute.yaml) on the shared listener, so /dws-admin/* always resolves here.
*/ -}}
{{- if .Values.apiGateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "dws.admin.fullname" . }}-route
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  parentRefs:
    - name: {{ include "dws.apiGateway.gatewayName" . }}
  {{- with .Values.apiGateway.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dws-admin
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1.0/invoke/{{ include "dws.admin.fullname" . }}/method
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: dapr-api-token
                value: {{ printf "$env://%s" (include "dws.apiGateway.adminTokenEnvName" .) | quote }}
      backendRefs:
        - name: {{ include "dws.admin.fullname" . }}
          port: {{ .Values.admin.service.port }}
{{- end }}
