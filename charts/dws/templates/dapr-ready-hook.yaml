{{- if or .Values.dapr.enabled .Values.observability.enabled }}
{{- /*
Self-heals admission-time injection races. The same-release Dapr control plane or
Instrumentation resource can become ready after workload Pods were first admitted, and neither
webhook revisits an existing Pod. Namespace-scoped RBAC mirrors the controller's Role/RoleBinding
pattern in templates/controller/rbac.yaml.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dws.daprReadyHook.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: dapr-ready-hook
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dws.daprReadyHook.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: dapr-ready-hook
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # To wait on the dapr-sidecar-injector Deployment's rollout.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # To find the admin Pod and delete it if its sidecar injection was missed.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  {{ if .Values.observability.enabled }}
  # To wait until the same-release Instrumentation exists before recreating missed Pods.
  - apiGroups: ["opentelemetry.io"]
    resources: ["instrumentations"]
    verbs: ["get"]
  {{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dws.daprReadyHook.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: dapr-ready-hook
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "dws.daprReadyHook.fullname" . }}
    namespace: {{ include "dws.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "dws.daprReadyHook.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dws.daprReadyHook.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: dapr-ready-hook
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "dws.labels" . | nindent 8 }}
        app.kubernetes.io/component: dapr-ready-hook
    spec:
      serviceAccountName: {{ include "dws.daprReadyHook.fullname" . }}
      restartPolicy: Never
      containers:
        - name: dapr-ready
          image: "{{ .Values.dapr.readyHook.image.repository }}:{{ .Values.dapr.readyHook.image.tag }}"
          imagePullPolicy: {{ .Values.dapr.readyHook.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |{{ if .Values.dapr.enabled }}
              set -eu
              ns="{{ include "dws.namespace" . }}"
              echo "waiting for dapr-sidecar-injector rollout in namespace $ns..."
              kubectl rollout status deployment/dapr-sidecar-injector -n "$ns" --timeout=180s
              # Deployment readiness doesn't guarantee the admission webhook is reachable
              # from the API server yet — give its cert/registration a beat to catch up.
              sleep 15

              pods=$(kubectl get pods -n "$ns" -l app.kubernetes.io/component=admin -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
              if [ -z "$pods" ]; then
                echo "no admin pod found, nothing to check"
                exit 0
              fi
              for pod in $pods; do
                containers=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null || true)
                echo "admin pod $pod containers: $containers"
                if ! echo "$containers" | grep -q daprd; then
                  echo "admin pod $pod is missing its daprd sidecar (injection missed), deleting to force re-injection"
                  kubectl delete pod "$pod" -n "$ns"
                fi
              done{{ end }}{{ if .Values.observability.enabled }}
              set -eu
              ns="{{ include "dws.namespace" . }}"
              instrumentation="{{ include "dws.observability.instrumentationName" . }}"

              echo "waiting for Instrumentation $instrumentation in namespace $ns..."
              for attempt in $(seq 1 60); do
                kubectl get instrumentation "$instrumentation" -n "$ns" >/dev/null 2>&1 && break
                sleep 2
              done
              kubectl get instrumentation "$instrumentation" -n "$ns" >/dev/null

              ensure_instrumented() {
                component="$1"
                deployment="$2"
                expected_init="$3"

                echo "checking OpenTelemetry injection for $component..."
                for attempt in $(seq 1 60); do
                  pods=$(kubectl get pods -n "$ns" -l "app.kubernetes.io/component=$component" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
                  [ -n "$pods" ] && break
                  sleep 2
                done
                [ -n "${pods:-}" ] || { echo "no $component pod found" >&2; exit 1; }

                for pod in $pods; do
                  init_containers=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null || true)
                  echo "$component pod $pod init containers: $init_containers"
                  if ! echo "$init_containers" | grep -qw "$expected_init"; then
                    echo "$component pod $pod missed OpenTelemetry injection, deleting to force re-admission"
                    kubectl delete pod "$pod" -n "$ns" --wait=false
                  fi
                done

                kubectl wait pod -n "$ns" -l "app.kubernetes.io/component=$component" --for=condition=Ready --timeout=300s
                pods=$(kubectl get pods -n "$ns" -l "app.kubernetes.io/component=$component" -o jsonpath='{.items[*].metadata.name}')
                for pod in $pods; do
                  init_containers=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.spec.initContainers[*].name}')
                  echo "$component pod $pod admitted init containers: $init_containers"
                  echo "$init_containers" | grep -qw "$expected_init" \
                    || { echo "$component pod $pod is still missing $expected_init" >&2; exit 1; }
                done
              }

              {{ if .Values.controller.enabled }}
              ensure_instrumented controller "{{ include "dws.controller.fullname" . }}" opentelemetry-auto-instrumentation-java
              {{ end }}
              {{ if .Values.admin.enabled }}
              ensure_instrumented admin "{{ include "dws.admin.fullname" . }}" opentelemetry-auto-instrumentation-nodejs{{ end }}
{{ end }}
{{ end }}
