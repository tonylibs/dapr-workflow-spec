{{- /*
Renders on every helm template/install/upgrade regardless of which components are toggled on,
so the Dapr, API Gateway, and observability preflight checks (see _preflight.tpl) and the
shared API Gateway / legacy-Ingress value validations (see _helpers.tpl) always run. Emits no
resource itself.
*/ -}}
{{- include "dws.preflight.dapr" . -}}
{{- include "dws.preflight.apiGateway" . -}}
{{- include "dws.preflight.observability" . -}}
{{- include "dws.observability.validate" . -}}
{{- include "dws.apiGateway.validate" . -}}
{{- include "dws.console.legacyIngress.validate" . -}}
{{- /*
Every enabled component's sidecar must require its own Dapr API token: one shared Secret would let
any of them call the others' sidecar APIs.
*/ -}}
{{- if .Values.auth.enabled -}}
{{- $seen := dict -}}
{{- range $c := list (dict "name" "admin" "enabled" .Values.admin.enabled) (dict "name" "controller" "enabled" .Values.controller.enabled) (dict "name" "schedule-time" "enabled" .Values.scheduleTime.enabled) -}}
{{- if $c.enabled -}}
{{- $ref := dict "root" $ "component" $c.name "kind" "daprApi" -}}
{{- $secret := include "dws.apiTokens.secretName" $ref -}}
{{- $key := include "dws.apiTokens.valuesKey" $ref -}}
{{- with get $seen $secret -}}
{{- fail (printf "%s and %s Dapr API tokens must use different Secrets; set distinct auth.apiTokens.%s.daprApi.existingSecret and auth.apiTokens.%s.daprApi.existingSecret" . $c.name (include "dws.apiTokens.valuesKey" (dict "component" .)) $key) -}}
{{- end -}}
{{- $_ := set $seen $secret $c.name -}}
{{- end -}}
{{- end -}}
{{- end -}}
