{{- /*
  admin-gateway nginx site config (auth roadmap Phase 4).

  Two behaviours share one location block at /workflows:
    - OPTIONS (browser preflight): return 204 with the CORS response headers, never
      proxy — Dapr's bearer middleware would 401 the preflight since it has no
      Authorization header.
    - Everything else: proxy_pass to dws-admin's Dapr sidecar HTTP port through the
      admin Service (which front-ports 3500 when auth.enabled=true, see
      templates/admin/service.yaml). The upstream URL is Dapr's service-invocation
      shape, which is what forces the bearer middleware to run.

  Origin allow-list evaluation is done with a small `map` so the exact allowed
  origin is echoed back (browsers reject wildcards on credentialed requests). An
  origin not in the list terminates with 403 rather than being proxied.
*/}}
{{- include "dws.adminGateway.validate" . -}}
{{- if .Values.adminGateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dws.adminGateway.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-gateway
data:
  default.conf: |
    # Allowed browser origins from adminGateway.corsOrigins. The map echoes an
    # incoming Origin back only when it appears verbatim in this list; anything
    # else resolves to the empty string, which the location block treats as
    # "not allowed".
    map $http_origin $dws_allowed_origin {
      default "";
      {{- range .Values.adminGateway.corsOrigins }}
      "{{ . }}" "{{ . }}";
      {{- end }}
    }

    server {
      listen 80 default_server;
      server_name _;

      # Small stub for readiness/liveness probes — served on the same listen port
      # so no extra Service port is needed.
      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location = /workflows {
        # Reject origins not in adminGateway.corsOrigins BEFORE either handling a
        # preflight or proxying; keeps `Access-Control-Allow-Origin` and the
        # actual upstream call gated by the same allow-list.
        if ($dws_allowed_origin = "") {
          return 403;
        }

        # CORS preflight: answered locally, never proxied. Dapr's bearer
        # middleware would 401 the preflight (no Authorization header on an
        # OPTIONS), so it must terminate here.
        if ($request_method = OPTIONS) {
          add_header Access-Control-Allow-Origin $dws_allowed_origin always;
          add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
          add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
          add_header Access-Control-Allow-Credentials "true" always;
          add_header Access-Control-Max-Age 600 always;
          add_header Content-Length 0;
          return 204;
        }

        # Actual request: forward to dws-admin's Dapr sidecar invoke path. The
        # upstream URL is Dapr service-invocation shape
        # (/v1.0/invoke/<app-id>/method/<method>), which makes the bearer
        # middleware on dws-admin's sidecar run before the app sees it.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        # Also expose the CORS headers on the proxied response so the browser
        # accepts it. dws-admin's direct read listener emits its own permissive
        # CORS header; suppress upstream CORS values so this credentialed gateway
        # response has exactly one, explicit origin. `always` includes the
        # gateway-owned headers on non-2xx (e.g. sidecar 401).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $dws_allowed_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        # With a static upstream, nginx resolves the Service through Kubernetes
        # DNS at startup and preserves the incoming query string automatically.
        # Do not append $is_args$args here: any variable in proxy_pass switches
        # nginx to runtime DNS resolution and requires an explicit resolver.
        proxy_pass http://{{ include "dws.admin.fullname" . }}.{{ include "dws.namespace" . }}.svc.cluster.local:3500/v1.0/invoke/{{ include "dws.admin.fullname" . }}/method/workflows;
      }

      # Anything else on this listener is not part of the write path — do not
      # accidentally proxy read routes or arbitrary paths.
      location / {
        return 404;
      }
    }
{{- end }}
