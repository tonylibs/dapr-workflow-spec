{{- /*
  Chart-owned Secret holding the OTLP export headers (e.g. a SaaS backend's API key) that the
  Instrumentation resource reads OTEL_EXPORTER_OTLP_HEADERS from.

  Rendered only when observability is enabled, observability.otlp.headers is non-empty, AND
  observability.otlp.existingSecret is unset — an operator-supplied Secret always wins and the
  chart then creates nothing, the same precedence the admin database Secret already uses.

  The single `headers` key is the whole contract: one comma-separated key=value list, sorted by
  key so repeat renders are byte-stable and a helm upgrade does not churn the Secret.
*/}}
{{- if and .Values.observability.enabled (not .Values.observability.otlp.existingSecret) .Values.observability.otlp.headers }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dws.observability.otlpSecretFullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability
type: Opaque
stringData:
  headers: {{ include "dws.observability.otlpHeaderList" . | quote }}
{{- end }}
