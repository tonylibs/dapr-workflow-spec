{{- if .Values.admin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dws.admin.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      {{- include "dws.admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dws.labels" . | nindent 8 }}
        app.kubernetes.io/component: admin
      {{- if or .Values.dapr.enabled .Values.auth.enabled }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ include "dws.admin.fullname" . | quote }}
        dapr.io/app-port: "3000"
        {{- if .Values.auth.enabled }}
        dapr.io/config: {{ include "dws.admin.auth.configName" . | quote }}
        {{- end }}
      {{- end }}
    spec:
      {{- include "dws.component.scheduling" (dict "root" . "component" .Values.admin) | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $wantPostgresWait := .Values.postgresql.enabled }}
      {{- $wantRedisWait := and .Values.dapr.enabled (not .Values.redis.external.host) }}
      {{- if or $wantPostgresWait $wantRedisWait }}
      initContainers:
        # Bitnami subcharts (postgresql, redis) don't gate the app pod's startup
        # on their own readiness — helm applies everything in one pass, so the
        # admin pod races the backing services. Postgres-not-ready crashes the
        # admin container mid-migration (ECONNREFUSED on port 5432); Redis-not-
        # ready fatally exits the daprd sidecar during pubsub.redis Component
        # init (`connect: connection refused` — pubsub.redis returns error
        # synchronously, so `spec.initTimeout` on the Component does not save it).
        # Wait for both TCP ports here so admin's containers start into a
        # reachable dependency set.
        {{- if $wantPostgresWait }}
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "dws.postgres.host" . }} 5432; do
                echo "waiting for postgres {{ include "dws.postgres.host" . }}:5432" >&2
                sleep 2
              done
        {{- end }}
        {{- if $wantRedisWait }}
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              # Strip the :port suffix off dws.redis.host — nc wants host and
              # port as separate args.
              host_port='{{ include "dws.redis.host" . }}'
              host=${host_port%:*}
              port=${host_port##*:}
              until nc -z "$host" "$port"; do
                echo "waiting for redis $host:$port" >&2
                sleep 2
              done
        {{- end }}
      {{- end }}
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.enabled }}
                  name: {{ include "dws.postgres.fullname" . }}
                  key: database-url
                  {{- else if .Values.admin.database.existingSecret }}
                  name: {{ .Values.admin.database.existingSecret }}
                  key: {{ .Values.admin.database.existingSecretKey | default "url" }}
                  {{- else }}
                  name: {{ include "dws.admin.fullname" . }}
                  key: database-url
                  {{- end }}
            - name: RUN_MIGRATIONS_ON_BOOT
              value: "true"
            {{- if or .Values.dapr.enabled .Values.auth.enabled }}
            - name: DAPR_PUBSUB_NAME
              value: {{ .Values.admin.pubsub.name | quote }}
            - name: DAPR_PUBSUB_TOPIC
              value: {{ .Values.admin.pubsub.topic | quote }}
            - name: DAPR_CONTROLLER_APP_ID
              value: {{ include "dws.controller.fullname" . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- include "dws.component.resources" (dict "root" . "component" .Values.admin) | nindent 12 }}
{{- end }}
