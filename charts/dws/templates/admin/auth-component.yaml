{{- /*
  Bearer JWT middleware for the dws-admin sidecar (auth roadmap Phase 4).
  Same values plumbing and Dex-derived fallback as templates/controller/auth-component.yaml,
  scoped to the dws-admin app-id so it only gates admin traffic and not the controller.

  The Component definition matches the controller's, but the paired Configurations do NOT:
  the admin Configuration references this Component from spec.httpPipeline.handlers (the
  sidecar's own Dapr HTTP API), whereas the controller uses spec.appHttpPipeline. That
  divergence is deliberate — see auth-configuration.yaml's header and dws-auth.md
  "Decision (2026-09-13)". The admin Pod's dapr.io/config annotation names that Configuration
  — the three files must stay in sync.
*/}}
{{- if and .Values.admin.enabled .Values.auth.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "dws.admin.auth.componentName" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.admin.selectorLabels" . | nindent 4 }}
spec:
  type: middleware.http.bearer
  version: v1
  metadata:
    - name: issuer
      value: {{ include "dws.auth.issuer" . | quote }}
    - name: audience
      value: {{ include "dws.auth.audience" . | quote }}
    {{- $jwks := include "dws.auth.jwksURL" . }}
    {{- if $jwks }}
    - name: jwksURL
      value: {{ $jwks | quote }}
    {{- end }}
scopes:
  - {{ include "dws.admin.fullname" . | quote }}
{{- end }}
