{{- if .Values.admin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dws.admin.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  selector:
    {{- include "dws.admin.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
    {{- if .Values.auth.enabled }}
    # Phase 4 auth: front-port the Dapr sidecar's HTTP port (default 3500) so the
    # admin-gateway (and any in-cluster caller) reaches the Phase 3 write-relay via
    # Dapr service invocation, which forces the bearer middleware to run. The app-port
    # (3000) above stays exposed unconditionally — read routes are intentionally
    # left alone (Phase 6 owns moving them onto the gated path).
    - name: dapr-http
      port: 3500
      targetPort: 3500
    {{- end }}
{{- end }}
