{{- if .Values.admin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dws.admin.fullname" . }}
  namespace: {{ include "dws.namespace" . }}
  labels:
    {{- include "dws.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  selector:
    {{- include "dws.admin.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.apiGateway.enabled }}
    # Secured API Gateway mode (auth roadmap section 2b): expose ONLY the Dapr sidecar's HTTP
    # port. Every browser-facing admin request - reads, writes, OpenAPI docs, and SSE - reaches
    # dws-admin exclusively through Dapr service invocation, which forces the sidecar's bearer
    # middleware to run before the app ever sees the request. The Nest app port (3000) remains a
    # container/probe-only port (see deployment.yaml) and is intentionally NOT Service-addressable
    # here - a parallel port targeting it would recreate the authentication bypass this mode
    # removes.
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: 3500
    {{- else }}
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
    {{- if .Values.auth.enabled }}
    # Migration-window behavior (auth.enabled=true, apiGateway.enabled=false): front-port the
    # Dapr sidecar's HTTP port so an in-cluster caller can reach the write-relay via Dapr service
    # invocation while the app port above stays reachable too. Superseded by the sidecar-only
    # port above once apiGateway.enabled=true replaces this Service topology entirely.
    - name: dapr-http
      port: 3500
      targetPort: 3500
    {{- end }}
    {{- end }}
{{- end }}
