apiVersion: v2
name: dws
description: A Helm chart for Kubernetes

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 1.0.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "1.18.0"

# In-chart Postgres backing dws-admin's read model is provided by the upstream Bitnami
# PostgreSQL chart, pulled in as a conditional dependency. It renders only when
# postgresql.enabled is true (the default); set it to false to point admin at an
# external/managed database instead.
#
# The Dapr control plane is provided by the upstream dapr/dapr chart, pulled in as a
# conditional dependency the same way. It installs only when dapr.enabled is true (the
# default); set it to false to use a cluster-external Dapr install instead (a preflight
# check then fails install/upgrade if Dapr CRDs aren't actually present).
#
# Dex, an optional in-chart IdP for dws-console (auth roadmap Phase 0), is provided by the
# upstream dexidp/helm-charts "dex" chart, pulled in as a conditional dependency the same
# way. It installs only when dex.enabled is true (default false, since no consumer wires up
# to it until a later phase).
#
# In-chart Redis backing the three Dapr Redis Components (pubsub, dws-definitions,
# actor state store) is provided by the upstream Bitnami Redis chart. It has NO
# independent enable toggle of its own — it exists solely to back those Components, so
# its condition is dapr.enabled: enabled whenever Dapr is (default), and not installed
# at all when Dapr is disabled. To point the Components at an external Redis instead,
# set redis.external.host (see values.yaml); the built-in subchart still installs
# alongside — a documented trade-off.
dependencies:
  - name: postgresql
    version: 16.7.27
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: dapr
    version: 1.18.1
    repository: https://dapr.github.io/helm-charts/
    condition: dapr.enabled
  - name: dex
    version: 0.24.1
    repository: https://charts.dexidp.io
    condition: dex.enabled
  - name: redis
    version: 28.0.6
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: dapr.enabled
