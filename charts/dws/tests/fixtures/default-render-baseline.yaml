# Source: dws/templates/dapr-ready-hook.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: dws-dapr-ready
  namespace: default
  labels:
    helm.sh/chart: dws-1.1.0
    app.kubernetes.io/name: dws
    app.kubernetes.io/instance: dws
    app.kubernetes.io/version: "1.18.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: dapr-ready-hook
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        helm.sh/chart: dws-1.1.0
        app.kubernetes.io/name: dws
        app.kubernetes.io/instance: dws
        app.kubernetes.io/version: "1.18.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: dapr-ready-hook
    spec:
      serviceAccountName: dws-dapr-ready
      restartPolicy: Never
      containers:
        - name: dapr-ready
          image: "docker.io/alpine/k8s:1.31.1"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ns="default"
              echo "waiting for dapr-sidecar-injector rollout in namespace $ns..."
              kubectl rollout status deployment/dapr-sidecar-injector -n "$ns" --timeout=180s
              # Deployment readiness doesn't guarantee the admission webhook is reachable
              # from the API server yet — give its cert/registration a beat to catch up.
              sleep 15

              echo "checking Dapr sidecar injection for admin..."
              for attempt in $(seq 1 60); do
                pods=$(kubectl get pods -n "$ns" -l app.kubernetes.io/component=admin -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
                [ -n "$pods" ] && break
                sleep 2
              done
              if [ -z "$pods" ]; then
                echo "no admin pod found, nothing to check"
              else
                for pod in $pods; do
                  containers=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null || true)
                  echo "admin pod $pod containers: $containers"
                  if ! echo "$containers" | grep -q daprd; then
                    echo "admin pod $pod is missing its daprd sidecar (injection missed), deleting to force re-injection"
                    kubectl delete pod "$pod" -n "$ns"
                  fi
                done
              fi
