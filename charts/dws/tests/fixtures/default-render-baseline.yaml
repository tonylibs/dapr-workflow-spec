apiVersion: apps/v1
kind: Deployment
metadata:
  name: dws-admin
  namespace: default
  labels:
    helm.sh/chart: dws-1.1.0
    app.kubernetes.io/name: dws
    app.kubernetes.io/instance: dws
    app.kubernetes.io/version: "1.18.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dws
      app.kubernetes.io/instance: dws
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        helm.sh/chart: dws-1.1.0
        app.kubernetes.io/name: dws
        app.kubernetes.io/instance: dws
        app.kubernetes.io/version: "1.18.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: admin
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "dws-admin"
        dapr.io/app-port: "3000"
    spec:
      
      initContainers:
        # Bitnami subcharts (postgresql, redis) don't gate the app pod's startup
        # on their own readiness — helm applies everything in one pass, so the
        # admin pod races the backing services. Postgres-not-ready crashes the
        # admin container mid-migration (ECONNREFUSED on port 5432); Redis-not-
        # ready fatally exits the daprd sidecar during pubsub.redis Component
        # init (`connect: connection refused` — pubsub.redis returns error
        # synchronously, so `spec.initTimeout` on the Component does not save it).
        # Wait for both TCP ports here so admin's containers start into a
        # reachable dependency set.
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z dws-postgresql 5432; do
                echo "waiting for postgres dws-postgresql:5432" >&2
                sleep 2
              done
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              # Strip the :port suffix off dws.redis.host — nc wants host and
              # port as separate args.
              host_port='dws-redis-master.default.svc.cluster.local:6379'
              host=${host_port%:*}
              port=${host_port##*:}
              until nc -z "$host" "$port"; do
                echo "waiting for redis $host:$port" >&2
                sleep 2
              done
      containers:
        - name: admin
          image: "ghcr.io/tonylibs/dws-admin:0.2.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dws-postgres
                  key: database-url
            - name: RUN_MIGRATIONS_ON_BOOT
              value: "true"
            - name: DAPR_PUBSUB_NAME
              value: "pubsub"
            - name: DAPR_PUBSUB_TOPIC
              value: "dws.events"
            - name: DAPR_CONTROLLER_APP_ID
              value: "dws-controller"
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
