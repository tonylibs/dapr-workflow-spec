apiVersion: apps/v1
kind: Deployment
metadata:
  name: dws-controller
  namespace: default
  labels:
    helm.sh/chart: dws-1.1.0
    app.kubernetes.io/name: dws
    app.kubernetes.io/instance: dws
    app.kubernetes.io/version: "1.18.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dws
      app.kubernetes.io/instance: dws
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        helm.sh/chart: dws-1.1.0
        app.kubernetes.io/name: dws
        app.kubernetes.io/instance: dws
        app.kubernetes.io/version: "1.18.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: controller
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "dws-controller"
        dapr.io/app-port: "8080"
    spec:
      serviceAccountName: dws-controller
      
      initContainers:
        # The daprd sidecar's pubsub.redis Component init returns error
        # synchronously on a first connection-refused, so if the sidecar starts
        # before the in-chart Bitnami Redis is Ready it fatally exits (see
        # admin/deployment.yaml for the full explanation and CI evidence). Wait
        # for Redis's TCP port here so the sidecar comes up into a reachable
        # dependency set.
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              host_port='dws-redis-master.default.svc.cluster.local:6379'
              host=${host_port%:*}
              port=${host_port##*:}
              until nc -z "$host" "$port"; do
                echo "waiting for redis $host:$port" >&2
                sleep 2
              done
      containers:
        - name: controller
          image: "ghcr.io/tonylibs/dws-controller:1.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DWS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DWS_IMAGES_CALL_HTTP
              value: "ghcr.io/tonylibs/dws-call-http:0.2.0"
            - name: DWS_IMAGES_CALL_OPENAPI
              value: "ghcr.io/tonylibs/dws-call-openapi:1.1.0"
            - name: DWS_IMAGES_CALL_GRPC
              value: "ghcr.io/tonylibs/dws-call-grpc:0.2.0"
            - name: DWS_IMAGES_CALL_ASYNCAPI
              value: "ghcr.io/tonylibs/dws-call-asyncapi:1.1.0"
            - name: DWS_IMAGES_CALL_A2A
              value: "ghcr.io/tonylibs/dws-call-a2a:latest"
            - name: DWS_IMAGES_RUN_SHELL
              value: "ghcr.io/tonylibs/dws-run-shell:0.2.0"
            - name: DWS_IMAGES_RUN_SCRIPT_JS
              value: "ghcr.io/tonylibs/dws-run-script-js:0.2.0"
            - name: DWS_IMAGES_RUN_SCRIPT_PYTHON
              value: "ghcr.io/tonylibs/dws-run-script-python:0.2.0"
            - name: DWS_IMAGES_ORCHESTRATOR
              value: "ghcr.io/tonylibs/dws-orchestrator:latest"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
