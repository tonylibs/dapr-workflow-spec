# Dev/eval OTLP receiver for verifying observability Phase 1 against a live cluster.
#
# NOT part of the chart and NOT production scaffolding — the chart deliberately ships no
# collector in Phase 1 (`observability.collector.enabled` is reserved for Phase 6 and does
# nothing yet). This exists so the Phase 1 live check has somewhere to send telemetry.
#
#   kubectl apply -n <release-namespace> -f charts/dws/tests/fixtures/otel-collector-dev.yaml
#   kubectl port-forward -n <release-namespace> svc/jaeger 16686:16686
#   # -> http://localhost:16686
#
# The Collector Service is named `dws-otel-collector` on purpose: that is what the chart's
# default `observability.otlp.endpoint` (http://dws-otel-collector:4318) resolves to, so a
# release in the same namespace needs no endpoint override at all.
#
# Division of labour:
#   - Jaeger renders the TRACE TREE. Phase 1's deliverable is one connected trace across
#     controller -> Dapr -> admin -> Postgres, and parentage is what has to be proven;
#     reading that out of raw log lines means matching trace/parent-span IDs by hand.
#   - The Collector's `debug` exporter proves METRICS AND LOGS arrive too, which Phase 1 also
#     requires and which Jaeger does not accept.
#
# Storage is in-memory. Everything is lost when a pod restarts. That is the intent.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dws-otel-collector-config
  labels:
    app.kubernetes.io/name: dws-otel-collector
    app.kubernetes.io/component: observability-dev
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          # 4318 = OTLP/HTTP, 4317 = OTLP/gRPC. Both are served so that flipping
          # observability.otlp.protocol between http/protobuf and grpc does not require
          # redeploying this collector — but note the chart does NOT rewrite the port for you.
          # Setting protocol=grpc means also setting the endpoint to :4317, or Dapr and the
          # language agents will dial a port that speaks the other protocol and silently
          # export nothing.
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: end
        include_file_path: true
        operators:
          - type: container
    processors:
      batch: {}
    exporters:
      # verbosity: detailed prints the spans/metrics/logs themselves. Without it you get
      # counts ("5 spans") and no evidence.
      debug:
        verbosity: detailed
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp, filelog]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dws-otel-collector
  labels:
    app.kubernetes.io/name: dws-otel-collector
    app.kubernetes.io/component: observability-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dws-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dws-otel-collector
        app.kubernetes.io/component: observability-dev
      annotations:
        # Keep Dapr out of this pod. It is test scaffolding, not a DWS component, and a
        # sidecar here would add spans that confuse the very trace being verified.
        dapr.io/enabled: "false"
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: dws-otel-collector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  # This exact name is what makes the chart's DEFAULT observability.otlp.endpoint work.
  # Renaming it means overriding observability.otlp.endpoint to match.
  name: dws-otel-collector
  labels:
    app.kubernetes.io/name: dws-otel-collector
    app.kubernetes.io/component: observability-dev
spec:
  selector:
    app.kubernetes.io/name: dws-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: observability-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: observability-dev
      annotations:
        dapr.io/enabled: "false"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            # all-in-one serves an OTLP receiver directly, so the collector forwards to it
            # rather than needing a jaeger-specific exporter.
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: ui
              containerPort: 16686
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: observability-dev
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: ui
      port: 16686
      targetPort: ui
