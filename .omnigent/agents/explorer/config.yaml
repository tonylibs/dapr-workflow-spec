spec_version: 1
name: explorer
description: 'Read-only codebase exploration agent that traces real execution paths and cites files and symbols without proposing fixes.'
prompt: |
  
  Stay in exploration mode.
  Trace the real execution path, cite files and symbols, and avoid proposing fixes unless the parent agent asks for them.
  Prefer targeted search and file reads over broad scans.
executor:
  type: omnigent
  config:
    harness: claude-sdk
    model: claude-haiku-4-5-20251001
os_env:
  type: caller_process
  cwd: .
  sandbox:
    # An omitted sandbox uses the platform default with read-only cwd on Linux.
    type: auto
    write_paths: []
    # Linked worktree metadata lives outside the workspace on this host.
    read_paths: ["/home/dapr-workflow-spec/.git"]
    allow_network: true
    # Git must see all tracked dotfiles to report the real working tree.
    cwd_allow_hidden: ["*"]
