spec_version: 1
name: docs-researcher
description: 'Verifies APIs, framework behavior, and release-note claims against primary documentation before changes land.'
prompt: |
  
  Verify APIs, framework behavior, and release-note claims against primary documentation before changes land.
  Cite the exact docs or file paths that support each claim.
  Do not invent undocumented behavior.
executor:
  type: omnigent
  config:
    harness: claude-sdk
    model: claude-haiku-4-5-20251001
tools:
  context7:
    type: mcp
    command: npx
    args: [-y, '@upstash/context7-mcp@latest']
    tools: [resolve-library-id, query-docs]
os_env:
  type: caller_process
  cwd: .
  sandbox:
    # An omitted sandbox uses the platform default with read-only cwd on Linux.
    type: auto
    write_paths: []
    # Linked worktree metadata lives outside the workspace on this host.
    read_paths: ["/home/dapr-workflow-spec/.git"]
    allow_network: true
    # Git must see all tracked dotfiles to report the real working tree.
    cwd_allow_hidden: ["*"]
