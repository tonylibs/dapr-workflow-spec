name: dws-call-a2a

on:
  push:
    branches: [main]
    tags:
      - 'dws-call-a2a-v*'
    paths:
      - 'dws-call-a2a/**'
      - '.github/workflows/dws-call-a2a.yml'
  pull_request:
    paths:
      - 'dws-call-a2a/**'
      - '.github/workflows/dws-call-a2a.yml'
  workflow_dispatch:

concurrency:
  group: dws-call-a2a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dws-call-a2a

jobs:
  test:
    name: lint, type-check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dws-call-a2a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.7"

      - name: Install dependencies
        # Pulls the exact pinned dependency set from uv.lock, including
        # a2a-sdk[fastapi] -- the conformance tier runs entirely in-process via
        # httpx.ASGITransport against a locally-built SDK agent, no external
        # network access required.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        # All three test tiers (unit, fake_server, conformance) run as one
        # invocation per pyproject.toml's testpaths.
        run: uv run pytest

  build-image:
    name: build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Skip on PRs: the image is built for validation but not pushed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=^dws-call-a2a-v(.*)$,group=1
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dws-call-a2a
          # Build on PRs to validate the Dockerfile; only push on merge to main.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dws-call-a2a
          cache-to: type=gha,mode=max,scope=dws-call-a2a
