name: component-release

# Manually triggered: run this whenever you deliberately want to cut a release for
# one component. release-please.yml already keeps each component's version file
# and CHANGELOG.md up to date on every merge to main and pushes the
# `<component>-v<version>` anchor tag when a release PR merges, but it never builds.
# This workflow creates that tag if it is missing (bootstrap/hotfix) and then
# dispatches the component's own build workflow (dws-admin.yml, dws-run.yml, etc.)
# on the tag to build and publish the matching image -- mirroring chart-release.yml's
# manual, deliberate trigger for the Helm chart. (Tags pushed with GITHUB_TOKEN never
# trigger `push: tags` workflows, hence the explicit dispatch.)
#
# See docs/release-process.md for the end-to-end runbook.
on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to release'
        required: true
        type: choice
        options:
          - dws-admin
          - dws-console
          - dws-controller
          - dws-orchestrator
          - dws-call-http
          - dws-call-grpc
          - dws-call-openapi
          - dws-call-asyncapi
          - dws-run
          - dws-call-a2a
      version:
        description: 'Exact version to release (e.g. 1.2.0). Leave blank to use the version already bumped in .release-please-manifest.json.'
        required: false
        type: string
      force:
        description: 'Skip the "release PR merged" guard (CHANGELOG + manifest checks). Only for bootstrap or hotfix tags.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and tag
        id: resolve
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          manifest_version=$(jq -r --arg c "$COMPONENT" '.[$c]' .release-please-manifest.json)
          version="${VERSION_OVERRIDE:-$manifest_version}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a valid X.Y.Z semver"
            exit 1
          fi
          tag="${COMPONENT}-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "manifest_version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Guard -- confirm this version was actually released on main
        # release-please bumps the manifest AND writes the CHANGELOG heading in the
        # same PR. If either is missing for this version, the component's release PR
        # hasn't been merged yet -- tagging now would point <component>-v<version>
        # at a commit whose version file still says the old version, and cut an
        # image whose CHANGELOG doesn't describe it. Refuse, unless `force` is set.
        if: ${{ inputs.force != true }}
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ steps.resolve.outputs.version }}
          MANIFEST_VERSION: ${{ steps.resolve.outputs.manifest_version }}
        run: |
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Requested version '$VERSION' does not match .release-please-manifest.json ('$MANIFEST_VERSION' for $COMPONENT)."
            echo "::error::Merge $COMPONENT's release-please PR first, or re-run with force=true if this is a deliberate bootstrap/hotfix tag."
            exit 1
          fi
          changelog="${COMPONENT}/CHANGELOG.md"
          if [ -f "$changelog" ]; then
            if ! grep -qF "[${VERSION}]" "$changelog" && ! grep -qxF "## ${VERSION}" "$changelog"; then
              echo "::error::$changelog has no entry for ${VERSION} -- $COMPONENT's release-please PR for this version doesn't look merged."
              echo "::error::Merge it first, or re-run with force=true if you know what you're doing."
              exit 1
            fi
          else
            echo "::notice::$changelog does not exist yet (bootstrap component) -- skipping the CHANGELOG check; manifest match already confirmed."
          fi

      - name: Tag and push
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          COMPONENT: ${{ inputs.component }}
          FORCE: ${{ inputs.force }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::notice::$TAG already exists on origin -- reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Tag the component's release commit, not HEAD: release-please uses the tagged
            # commit as the cut-off when listing commits for the next release PR, and it
            # must touch <component>/ -- a tag on an unrelated commit makes it re-list
            # old commits.
            sha=$(git log -1 --first-parent --format=%H -- "${COMPONENT}/CHANGELOG.md")
            if [ -z "$sha" ]; then
              if [ "$FORCE" = "true" ]; then
                sha=$(git rev-parse HEAD)
                echo "::notice::${COMPONENT}/CHANGELOG.md has no history -- force=true, tagging HEAD ($sha)."
              else
                echo "::error::No commit found for ${COMPONENT}/CHANGELOG.md, so there is no release commit to tag. Re-run with force=true to tag HEAD."
                exit 1
              fi
            fi
            git tag "$TAG" "$sha"
            git push origin "$TAG"
            echo "::notice::Pushed $TAG at $sha."
          fi

      - name: Start the component build on the tag
        # GITHUB_TOKEN-pushed tags don't fire `push: tags`, so dispatch explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          gh workflow run "${COMPONENT}.yml" --ref "$TAG"
          echo "::notice::Started ${COMPONENT}.yml on $TAG -- it will publish ghcr.io/${GITHUB_REPOSITORY_OWNER}/${COMPONENT}:${{ steps.resolve.outputs.version }}."
