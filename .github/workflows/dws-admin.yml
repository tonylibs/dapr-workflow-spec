name: dws-admin

on:
  push:
    branches: [main]
    paths:
      - 'dws-admin/**'
      - '.github/workflows/dws-admin.yml'
  pull_request:
    paths:
      - 'dws-admin/**'
      - '.github/workflows/dws-admin.yml'
  workflow_dispatch:

concurrency:
  group: dws-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dws-admin

jobs:
  test:
    name: compile & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dws-admin
    services:
      # Event-ingestion tests exercise the real upsert SQL (ON CONFLICT ...
      # DO UPDATE merge rules) against a live Postgres rather than a mock.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dws
          POSTGRES_PASSWORD: dws
          POSTGRES_DB: dws_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dws -d dws_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dws:dws@localhost:5432/dws_admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: dws-admin/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dws-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      # Tests share the service Postgres and clean up via TRUNCATE between
      # cases, so they run serially (--runInBand, set in package.json).
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  build-image:
    name: build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Skip on PRs: the image is built for validation but not pushed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dws-admin
          # Build on PRs to validate the Dockerfile; only push on merge to main.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dws-admin
          cache-to: type=gha,mode=max,scope=dws-admin
