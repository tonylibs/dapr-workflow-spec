name: release-please

# Watches every push to main and, per component (see release-please-config.json),
# maintains a standing "release PR" that accumulates Conventional Commit changes
# under that component's path. Merging that PR only bumps the component's version
# file, updates its CHANGELOG.md, and updates .release-please-manifest.json --
# every package sets `skip-github-release: true`, so no tag and no GitHub Release
# are created here. Cutting an actual release (tag + image build/publish) for a
# component is a separate, deliberate step: see component-release.yml
# (workflow_dispatch) for that, mirroring chart-release.yml for the Helm chart.
#
# Because release-please never relabels merged release PRs when GitHub releases
# are skipped, the first step swaps `autorelease: pending` -> `autorelease: tagged`
# on merged release PRs so they don't block later runs.
on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Mark merged release PRs as tagged
        # skip-github-release: true means release-please never relabels merged
        # release PRs; one left at `autorelease: pending` blocks all later runs.
        # This only swaps a label: no tag, no GitHub Release.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state merged --label "autorelease: pending" --limit 100 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .number' |
          while read -r n; do
            echo "Relabeling #$n: autorelease: pending -> autorelease: tagged"
            gh pr edit "$n" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          done

      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
