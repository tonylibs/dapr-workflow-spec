name: dws-step

on:
  push:
    branches: [main]
    tags:
      - 'dws-step-v*'
    paths:
      - 'dws-step/**'
      - '.github/workflows/dws-step.yml'
  pull_request:
    paths:
      - 'dws-step/**'
      - '.github/workflows/dws-step.yml'
  workflow_dispatch:

concurrency:
  group: dws-step-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dws-step

jobs:
  test:
    name: compile & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dws-step
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Compile
        run: ./mvnw -B -ntp clean compile

      - name: Test
        run: ./mvnw -B -ntp verify

  smoke:
    name: /healthz smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dws-step:smoke dws-step

      - name: Boot and probe /healthz
        # No Dapr sidecar in CI: the worker logs that the sidecar is unavailable and retries,
        # while the HTTP server still serves /healthz.
        run: |
          docker run -d --name dws-step-smoke -p 8080:8080 \
            -e DWS_STEP_DEFINITION_PATH=/defs/step-set.json \
            -v "$PWD/openspec/schemas/examples:/defs:ro" \
            dws-step:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs dws-step-smoke
          exit 1

      - name: Dump logs
        if: always()
        run: docker logs dws-step-smoke || true

  build-image:
    name: build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Skip on PRs: the image is built for validation but not pushed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=^dws-step-v(.*)$,group=1
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dws-step
          # Build on PRs to validate the Dockerfile; only push on merge to main.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dws-step
          cache-to: type=gha,mode=max,scope=dws-step
