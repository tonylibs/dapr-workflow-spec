name: dws-step

on:
  push:
    branches: [main]
    tags:
      - 'dws-step-v*'
    paths:
      - 'dws-step/**'
      - '.github/workflows/dws-step.yml'
  pull_request:
    paths:
      - 'dws-step/**'
      - '.github/workflows/dws-step.yml'
  workflow_dispatch:

concurrency:
  group: dws-step-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dws-step

jobs:
  test:
    name: format, compile & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dws-step
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: dws-step/pom.xml

      # The pom binds spotless:apply to process-sources, so a plain `verify` would
      # reformat the code on the runner and pass. Check first so drift fails the job.
      - name: Check formatting
        run: ./mvnw -B -ntp spotless:check

      - name: Verify
        run: ./mvnw -B -ntp verify

  build-image:
    name: build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Skip on PRs: the image is built for validation but not pushed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=^dws-step-v(.*)$,group=1
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Loaded into the local daemon rather than pushed, so the next step can
      # run the very image that would ship.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: dws-step
          load: true
          tags: dws-step:smoke
          cache-from: type=gha,scope=dws-step
          cache-to: type=gha,mode=max,scope=dws-step

      # The service needs a pinned single-node definition at startup and exits if
      # it is missing or invalid. It does not need a Dapr sidecar to boot: the
      # workflow worker logs that the sidecar is unavailable and keeps retrying
      # while the HTTP server serves /healthz. Require that answer.
      - name: Smoke-test the image
        run: |
          dir=$(mktemp -d)
          cat > "$dir/definition.json" <<'JSON'
          {
            "workflow": "smoke",
            "version": "smoke@v1",
            "nodeId": "smoke-step",
            "kind": "step",
            "task": { "set": { "validated": true } }
          }
          JSON
          chmod -R a+rX "$dir"
          docker run -d --name dws-step-smoke -p 8080:8080 \
            -v "$dir:/definition:ro" \
            -e DWS_STEP_DEFINITION_PATH=/definition/definition.json \
            dws-step:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; break; fi
            if [ "$i" -eq 30 ]; then
              echo "container did not become healthy"; docker logs dws-step-smoke; exit 1
            fi
            sleep 2
          done
          docker rm -f dws-step-smoke

      # Fully cached by the build above, so this re-tags and uploads rather
      # than rebuilding. Skipped on PRs — validated there, published on merge.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: dws-step
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dws-step
