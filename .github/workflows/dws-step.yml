name: dws-step

on:
  push:
    branches: [main]
    tags:
      - 'dws-step-v*'
    paths:
      - 'dws-step/**'
      - '.github/workflows/dws-step.yml'
  pull_request:
    paths:
      - 'dws-step/**'
      - '.github/workflows/dws-step.yml'
  workflow_dispatch:

concurrency:
  group: dws-step-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dws-step

jobs:
  test:
    name: format, compile & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dws-step
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: dws-step/pom.xml

      # The pom binds spotless:apply to process-sources, so a plain `verify` would
      # reformat the code on the runner and pass. Check first so drift fails the job.
      - name: Check formatting
        run: ./mvnw -B -ntp spotless:check

      - name: Verify
        run: ./mvnw -B -ntp verify

  build-image:
    name: build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Skip on PRs: the image is built for validation but not pushed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=^dws-step-v(.*)$,group=1
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Loaded into the local daemon rather than pushed, so the next step can
      # run the very image that would ship.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: dws-step
          load: true
          tags: dws-step:smoke
          cache-from: type=gha,scope=dws-step
          cache-to: type=gha,mode=max,scope=dws-step

      # No smoke test yet, deliberately. Booting the image needs only a pinned
      # single-node definition (DWS_STEP_DEFINITION_PATH) -- the Dapr workflow worker
      # runs on a background thread and just retries when no sidecar is reachable --
      # but today the image does not start at all: StepRuntimeConfig asks for a
      # com.fasterxml ObjectMapper bean, and Spring Boot 4 only auto-configures
      # Jackson 3, so the context fails with NoSuchBeanDefinition. The unit tests
      # never start the context, so nothing else catches it. Add a /healthz smoke
      # step (see dws-flow.yml) once that is fixed; until then it would be red.

      # Fully cached by the build above, so this re-tags and uploads rather
      # than rebuilding. Skipped on PRs — validated there, published on merge.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: dws-step
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dws-step
