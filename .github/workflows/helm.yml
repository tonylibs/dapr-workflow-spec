name: helm-chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  workflow_dispatch:

concurrency:
  group: helm-chart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: charts/dws
  # OCI registry namespace for the packaged chart: ghcr.io/<owner>/charts
  OCI_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  verify:
    name: lint, template & dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Fetch chart dependencies
        # `update` (not `build`) so this doesn't depend on the committed Chart.lock
        # already matching Chart.yaml — it re-resolves and re-fetches from Chart.yaml
        # directly, which is what's needed right after a dependency is added/changed.
        run: helm dependency update ${{ env.CHART_DIR }}

      - name: Lint
        run: helm lint ${{ env.CHART_DIR }}

      - name: Template (default values)
        run: helm template dws ${{ env.CHART_DIR }} > /tmp/render-default.yaml

      - name: Template (controller disabled)
        run: |
          out=$(helm template dws ${{ env.CHART_DIR }} --set controller.enabled=false)
          if echo "$out" | grep -q 'app.kubernetes.io/component: controller'; then
            echo "::error::controller resources rendered while controller.enabled=false"
            exit 1
          fi

      - name: Template (value overrides)
        run: |
          helm template dws ${{ env.CHART_DIR }} \
            --set controller.replicaCount=3 \
            --set controller.image.repository=ghcr.io/${{ github.repository_owner }}/dws-controller \
            --set controller.image.tag=ci-test \
            --set controller.service.port=9090 \
            --set controller.images.run=ghcr.io/${{ github.repository_owner }}/dws-run:ci > /dev/null

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install Dapr CRDs
        # --dry-run=server validates every rendered resource against the real API
        # server, and the chart now installs Dapr by default (Phase 4), which
        # renders a Configuration CR ("daprsystem"). Helm's own crds/ pre-install
        # step doesn't run under --dry-run=server, so apply the same pinned CRD
        # bundle dws-controller already vendors, up front, to unblock validation.
        run: kubectl apply -f dws-controller/k8s/dapr-crds.yaml

      - name: Server-side dry-run install
        # Validates the rendered manifests against a real API server.
        # NOTE: --dry-run=server never starts a pod, so it cannot catch a broken
        # admin/Postgres integration (a bad DATABASE_URL, a Postgres that never comes
        # up, etc.) — see the `integration` job below for that.
        run: |
          helm install dws ${{ env.CHART_DIR }} \
            --namespace dws-system --create-namespace \
            --dry-run=server

  integration:
    name: real install & admin/postgres DB test
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Fetch chart dependencies
        # `update` (not `build`) so this doesn't depend on the committed Chart.lock
        # already matching Chart.yaml — it re-resolves and re-fetches from Chart.yaml
        # directly, which is what's needed right after a dependency is added/changed.
        run: helm dependency update ${{ env.CHART_DIR }}

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Create namespace and ghcr pull secret
        # ghcr.io/tonylibs/dws-admin is a private package, so the kind node's
        # anonymous pull fails even with a valid tag — wire GITHUB_TOKEN in as
        # an imagePullSecret the same way a real cluster would use one. Created
        # up front so it exists before the admin Pod references it below.
        run: |
          kubectl create namespace dws-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace dws-system \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}

      - name: Install (real, no dry-run)
        # A single, real `helm install` — Dapr, admin, and postgres all come up in
        # the same release, exactly like a real operator's default install. The
        # chart's own dapr-ready-hook post-install Job (templates/dapr-ready-hook.yaml)
        # is what makes this safe: it waits for the dapr-sidecar-injector rollout and
        # self-heals the admin Pod if its sidecar injection was missed, so this test
        # exercises the actual fix rather than a CI-only workaround.
        # Scoped off controller: controller.image.tag has no published "1.0" image
        # (dws-controller.yml only pushes latest/sha/branch tags), so leave it disabled
        # here rather than have its pod ImagePullBackOff and blow the wait timeout.
        # admin.image.tag is overridden to "latest" for the same reason. No --wait here —
        # the explicit rollout-status steps below do the waiting (post-install hooks
        # block the `helm install` call itself until they complete, so the hook has
        # already run by the time this command returns) and, on failure, the debug
        # step can still inspect pod state instead of only getting a bare timeout.
        run: |
          helm install dws ${{ env.CHART_DIR }} \
            --namespace dws-system --create-namespace \
            --set controller.enabled=false \
            --set postgresql.enabled=true \
            --set dapr.enabled=true \
            --set admin.image.tag=latest \
            --set imagePullSecrets[0].name=ghcr-pull \
            --timeout 5m

      - name: Wait for admin rollout
        run: kubectl rollout status deployment/dws-admin -n dws-system --timeout=5m

      - name: Wait for postgres rollout
        run: kubectl rollout status statefulset/dws-postgresql -n dws-system --timeout=5m

      - name: Wait for redis rollout
        # The chart's Bitnami Redis subchart (backs the Dapr pubsub / dws-definitions /
        # actor-statestore Components) installs whenever dapr.enabled=true, per the
        # Chart.yaml condition wired in for Phase 5. Wait for it before asserting the
        # pubsub Component below.
        run: kubectl rollout status statefulset/dws-redis-master -n dws-system --timeout=5m

      - name: Assert pubsub Component present
        run: |
          kubectl get component pubsub -n dws-system
          kubectl get component dws-definitions -n dws-system
          kubectl get component dws-actor-statestore -n dws-system

      - name: End-to-end pubsub delivery check
        # Proves the chart-managed `pubsub` Component actually carries traffic:
        # deploy a Dapr-enabled subscriber Pod bound to topic `dws.events` via a
        # Subscription CRD and a passive Dapr-enabled publisher Pod, wait for both
        # pods' `Ready` condition (which requires their daprd sidecars to be Running
        # AND Ready, so injection races and sidecar-startup timing are already
        # resolved), then `kubectl exec` the publisher's localhost daprd to publish
        # a probe, and grep the subscriber Pod's logs for the payload.
        # Transport-only, per the Phase 5 spec — no controller/orchestrator/admin
        # round-trip is exercised here.
        run: |
          set -euo pipefail
          NS=dws-system
          PROBE="phase-5-$(date +%s)"

          # dapr-ready-hook self-heals admin's sidecar at install time, but the
          # dapr-sidecar-injector Deployment can flap under kind's tight resource
          # limits between then and now, meaning a new pod (like our e2e pair) can
          # be admitted while the injector's mutating webhook is momentarily
          # unavailable — no sidecar gets injected. Gate on the injector being
          # Available right before submitting the e2e pods.
          kubectl rollout status deployment/dapr-sidecar-injector -n "$NS" --timeout=3m

          apply_e2e_pods() {
            cat <<EOF | kubectl apply -n "$NS" -f -
          apiVersion: dapr.io/v2alpha1
          kind: Subscription
          metadata:
            name: pubsub-e2e-sub
          spec:
            pubsubname: pubsub
            topic: dws.events
            routes:
              default: /events
          scopes:
            - pubsub-e2e-subscriber
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: pubsub-e2e-subscriber
            annotations:
              dapr.io/enabled: "true"
              dapr.io/app-id: "pubsub-e2e-subscriber"
              dapr.io/app-port: "8080"
          spec:
            restartPolicy: Never
            containers:
              - name: sub
                image: mendhak/http-https-echo:36
                env:
                  - name: HTTP_PORT
                    value: "8080"
                ports:
                  - containerPort: 8080
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: pubsub-e2e-publisher
            annotations:
              dapr.io/enabled: "true"
              dapr.io/app-id: "pubsub-e2e-publisher"
          spec:
            restartPolicy: Never
            containers:
              - name: pub
                # Passive placeholder — the actual publish runs via \`kubectl exec\`
                # below, after Pod-Ready guarantees the daprd sidecar is up.
                image: curlimages/curl:8.11.1
                command: ["sleep", "600"]
          EOF
          }

          check_injection() {
            for pod in pubsub-e2e-subscriber pubsub-e2e-publisher; do
              for i in $(seq 1 30); do
                containers=$(kubectl get pod "$pod" -n "$NS" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null || true)
                case " $containers " in
                  *" daprd "*) break ;;
                esac
                sleep 2
              done
              case " $containers " in
                *" daprd "*) ;;
                *) echo "$pod missing daprd (containers: $containers)"; return 1 ;;
              esac
            done
          }

          apply_e2e_pods
          if ! check_injection; then
            echo "sidecar injection missed on first apply; deleting and retrying once"
            kubectl delete pod pubsub-e2e-subscriber pubsub-e2e-publisher -n "$NS" --ignore-not-found --wait=true
            kubectl rollout status deployment/dapr-sidecar-injector -n "$NS" --timeout=3m
            apply_e2e_pods
            check_injection || { echo "::error::daprd sidecar was not injected after retry"; exit 1; }
          fi

          # Ready on a multi-container Pod requires every container Ready, so this
          # blocks until both `sub`/`pub` AND their `daprd` sidecars are up.
          kubectl wait --for=condition=Ready pod/pubsub-e2e-subscriber -n "$NS" --timeout=3m
          kubectl wait --for=condition=Ready pod/pubsub-e2e-publisher -n "$NS" --timeout=3m

          # Publish two REAL DWS lifecycle events (per docs/events.md) through the
          # publisher pod's now-confirmed-Ready daprd sidecar — one from the controller
          # catalog (io.dws.definition.created), one from the orchestrator catalog
          # (io.dws.instance.started). Uses the same envelope shape (id/source/type/
          # time/datacontenttype/data) both Java publishers actually emit, so the test
          # proves the wiring carries real event payloads, not just a synthetic probe.
          # `kubectl exec` failure exits non-zero under `set -e`, failing the step
          # loudly instead of silently continuing.
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          DEF_ID="e2e-def-$(date +%s)-$RANDOM"
          INST_ID="e2e-inst-$(date +%s)-$RANDOM"
          echo "publishing io.dws.definition.created id=$DEF_ID"
          kubectl exec -n "$NS" pubsub-e2e-publisher -c pub -- \
            curl -sfS -X POST \
              -H 'Content-Type: application/json' \
              -d "{\"id\":\"$DEF_ID\",\"source\":\"dws-controller\",\"type\":\"io.dws.definition.created\",\"time\":\"$NOW\",\"datacontenttype\":\"application/json\",\"data\":{\"workflow\":\"order\",\"version\":\"vpubsube2e\",\"createdAt\":\"$NOW\"}}" \
              http://localhost:3500/v1.0/publish/pubsub/dws.events

          echo "publishing io.dws.instance.started id=$INST_ID"
          kubectl exec -n "$NS" pubsub-e2e-publisher -c pub -- \
            curl -sfS -X POST \
              -H 'Content-Type: application/json' \
              -d "{\"id\":\"$INST_ID\",\"source\":\"dws-orchestrator/order\",\"type\":\"io.dws.instance.started\",\"time\":\"$NOW\",\"datacontenttype\":\"application/json\",\"data\":{\"instanceId\":\"inst-e2e\",\"workflow\":\"order\",\"version\":\"vpubsube2e\",\"appId\":\"order\",\"startedAt\":\"$NOW\"}}" \
              http://localhost:3500/v1.0/publish/pubsub/dws.events

          # Wait until both events land in the subscriber log — checked by unique
          # per-event id AND by the exact type string, so a delivery of one but not
          # the other still fails.
          need_def=1
          need_inst=1
          for i in $(seq 1 45); do
            log=$(kubectl logs pubsub-e2e-subscriber -n "$NS" -c sub 2>/dev/null || true)
            echo "$log" | grep -q "$DEF_ID"  && echo "$log" | grep -q "io.dws.definition.created" && need_def=0
            echo "$log" | grep -q "$INST_ID" && echo "$log" | grep -q "io.dws.instance.started"   && need_inst=0
            [ "$need_def" = "0" ] && [ "$need_inst" = "0" ] && break
            sleep 2
          done
          if [ "$need_def" = "0" ] && [ "$need_inst" = "0" ]; then
            echo "pubsub delivery confirmed: io.dws.definition.created + io.dws.instance.started"
            exit 0
          fi
          echo "::error::pubsub e2e failed — missing: $( [ "$need_def" = "1" ] && echo -n definition.created ) $( [ "$need_inst" = "1" ] && echo -n instance.started )"
          kubectl logs pubsub-e2e-subscriber -n "$NS" -c sub || true
          kubectl logs pubsub-e2e-subscriber -n "$NS" -c daprd --tail=100 || true
          exit 1

      - name: Debug pod state on failure
        if: failure()
        run: |
          kubectl get pods -n dws-system -o wide
          kubectl get events -n dws-system --sort-by=.lastTimestamp
          kubectl describe pods -n dws-system -l app.kubernetes.io/component=admin
          kubectl describe pods -n dws-system -l app.kubernetes.io/name=postgresql
          echo "--- admin pod logs, all containers (current) ---"
          kubectl logs -n dws-system -l app.kubernetes.io/component=admin --all-containers --prefix --tail=200 || true
          echo "--- admin pod logs, all containers (previous, if crashlooping) ---"
          kubectl logs -n dws-system -l app.kubernetes.io/component=admin --all-containers --prefix --previous --tail=200 || true
          echo "--- dapr pods (dws-system) ---"
          kubectl get pods -n dws-system -l app.kubernetes.io/name=dapr -o wide || true
          echo "--- dapr-ready-hook job logs ---"
          kubectl logs -n dws-system -l app.kubernetes.io/component=dapr-ready-hook --all-containers --prefix --tail=200 || true
          echo "--- redis pod state ---"
          kubectl describe statefulset/dws-redis-master -n dws-system || true
          kubectl logs -n dws-system -l app.kubernetes.io/name=redis --all-containers --prefix --tail=200 || true
          echo "--- dapr Components (dws-system) ---"
          kubectl get components -n dws-system -o wide || true
          kubectl describe component pubsub -n dws-system || true
          echo "--- pubsub e2e pods ---"
          kubectl get pods -n dws-system -l 'app.kubernetes.io/name!=redis' -o wide | grep pubsub-e2e || true
          kubectl logs pubsub-e2e-publisher -n dws-system --all-containers --prefix --tail=200 || true
          kubectl logs pubsub-e2e-subscriber -n dws-system --all-containers --prefix --tail=200 || true

      - name: Run helm test
        run: helm test dws --namespace dws-system --logs

  integration-dapr-preinstalled:
    name: install with dapr.enabled=false against a pre-installed Dapr
    runs-on: ubuntu-latest
    needs: verify
    # dapr.enabled=false means "Dapr is already installed in this cluster" (an
    # operator running a shared, externally-managed Dapr control plane), not "don't
    # use Dapr" — dws-admin still needs dapr.enabled=true at install time to get its
    # sidecar annotations (see the `integration` job above). What this leg actually
    # proves: with that toggle off, the chart does not try to install its own Dapr
    # dependency, and the preflight check passes when Dapr is genuinely present —
    # not a full admin rollout.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Fetch chart dependencies
        run: helm dependency update ${{ env.CHART_DIR }}

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install Dapr control plane out-of-band
        run: |
          wget -q https://raw.githubusercontent.com/dapr/cli/master/install/install.sh -O - | /bin/bash
          dapr init -k --wait --timeout 300

      - name: Install chart with dapr.enabled=false
        # Everything else disabled too: this leg only exercises the preflight
        # check's "Dapr present" pass-through and confirms no Dapr subchart
        # resources get installed by the chart itself.
        run: |
          helm install dws ${{ env.CHART_DIR }} \
            --namespace dws-system --create-namespace \
            --set controller.enabled=false \
            --set admin.enabled=false \
            --set postgresql.enabled=false \
            --set dapr.enabled=false \
            --timeout 2m

      - name: Verify no chart-installed Dapr resources
        run: |
          if kubectl get pods -n dws-system -l app.kubernetes.io/name=dapr 2>/dev/null | grep -q .; then
            echo "::error::dapr.enabled=false but the chart installed Dapr resources anyway"
            exit 1
          fi

  release:
    name: package & push (OCI)
    # Publish only on merge to the default branch — PRs verify but never push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package ${{ env.CHART_DIR }} --destination /tmp/chart

      - name: Push chart to OCI registry
        run: |
          chart_pkg=$(ls /tmp/chart/*.tgz)
          echo "Pushing $chart_pkg to oci://${{ env.OCI_REGISTRY }}"
          helm push "$chart_pkg" "oci://${{ env.OCI_REGISTRY }}"
