name: helm-chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  workflow_dispatch:
    inputs:
      dapr_version:
        description: Dapr Helm chart version for the OAuth path-filter integration probe
        required: false
        default: '1.18.1'

concurrency:
  group: helm-chart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: charts/dws
  # The OAuth integration job installs this exact version independently of the chart so a
  # maintainer can exercise a newer compatible Dapr release without changing Chart.yaml.
  DAPR_VERSION: ${{ inputs.dapr_version || '1.18.1' }}
  # OCI registry namespace for the packaged chart: ghcr.io/<owner>/charts
  OCI_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  verify:
    name: lint, template & dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Fetch chart dependencies
        # `update` (not `build`) so this doesn't depend on the committed Chart.lock
        # already matching Chart.yaml — it re-resolves and re-fetches from Chart.yaml
        # directly, which is what's needed right after a dependency is added/changed.
        run: helm dependency update ${{ env.CHART_DIR }}

      - name: Lint
        run: helm lint ${{ env.CHART_DIR }}

      - name: Template shared values schema
        run: bash ${{ env.CHART_DIR }}/tests/values-schema-test.sh ${{ env.CHART_DIR }}

      - name: Verify API gateway rendering
        run: bash ${{ env.CHART_DIR }}/tests/api-gateway-render-test.sh ${{ env.CHART_DIR }}

      - name: Template (default values)
        run: helm template dws ${{ env.CHART_DIR }} > /tmp/render-default.yaml

      - name: Template (controller disabled)
        run: |
          out=$(helm template dws ${{ env.CHART_DIR }} --set controller.enabled=false)
          if echo "$out" | grep -q 'app.kubernetes.io/component: controller'; then
            echo "::error::controller resources rendered while controller.enabled=false"
            exit 1
          fi

      - name: Template (value overrides)
        run: |
          helm template dws ${{ env.CHART_DIR }} \
            --set controller.replicaCount=3 \
            --set controller.image.repository=ghcr.io/${{ github.repository_owner }}/dws-controller \
            --set controller.image.tag=ci-test \
            --set controller.service.port=9090 \
            --set controller.images.run=ghcr.io/${{ github.repository_owner }}/dws-run:ci > /dev/null

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install Dapr CRDs
        # --dry-run=server validates every rendered resource against the real API
        # server, and the chart now installs Dapr by default (Phase 4), which
        # renders a Configuration CR ("daprsystem"). Helm's own crds/ pre-install
        # step doesn't run under --dry-run=server, so apply the same pinned CRD
        # bundle dws-controller already vendors, up front, to unblock validation.
        run: kubectl apply -f dws-controller/k8s/dapr-crds.yaml

      - name: Server-side dry-run install
        # Validates the rendered manifests against a real API server.
        # NOTE: --dry-run=server never starts a pod, so it cannot catch a broken
        # admin/Postgres integration (a bad DATABASE_URL, a Postgres that never comes
        # up, etc.) — see the `integration` job below for that.
        run: |
          helm install dws ${{ env.CHART_DIR }} \
            --namespace dws-system --create-namespace \
            --dry-run=server

  integration:
    name: real install & admin/postgres DB test
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Fetch chart dependencies
        # `update` (not `build`) so this doesn't depend on the committed Chart.lock
        # already matching Chart.yaml — it re-resolves and re-fetches from Chart.yaml
        # directly, which is what's needed right after a dependency is added/changed.
        run: helm dependency update ${{ env.CHART_DIR }}

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Create namespace and ghcr pull secret
        # ghcr.io/tonylibs/dws-admin is a private package, so the kind node's
        # anonymous pull fails even with a valid tag — wire GITHUB_TOKEN in as
        # an imagePullSecret the same way a real cluster would use one. Created
        # up front so it exists before the admin Pod references it below.
        run: |
          kubectl create namespace dws-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace dws-system \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}

      - name: Install (real, no dry-run)
        # A single, real `helm install` — Dapr, admin, and postgres all come up in
        # the same release, exactly like a real operator's default install. The
        # chart's own dapr-ready-hook post-install Job (templates/dapr-ready-hook.yaml)
        # is what makes this safe: it waits for the dapr-sidecar-injector rollout and
        # self-heals the admin Pod if its sidecar injection was missed, so this test
        # exercises the actual fix rather than a CI-only workaround.
        # Scoped off controller: controller.image.tag has no published "1.0" image
        # (dws-controller.yml only pushes latest/sha/branch tags), so leave it disabled
        # here rather than have its pod ImagePullBackOff and blow the wait timeout.
        # admin.image.tag is overridden to "latest" for the same reason. No --wait here —
        # the explicit rollout-status steps below do the waiting (post-install hooks
        # block the `helm install` call itself until they complete, so the hook has
        # already run by the time this command returns) and, on failure, the debug
        # step can still inspect pod state instead of only getting a bare timeout.
        run: |
          helm install dws ${{ env.CHART_DIR }} \
            --namespace dws-system --create-namespace \
            --set controller.enabled=false \
            --set postgresql.enabled=true \
            --set dapr.enabled=true \
            --set admin.image.tag=latest \
            --set imagePullSecrets[0].name=ghcr-pull \
            --timeout 5m

      - name: Wait for admin rollout
        run: kubectl rollout status deployment/dws-admin -n dws-system --timeout=5m

      - name: Wait for postgres rollout
        run: kubectl rollout status statefulset/dws-postgresql -n dws-system --timeout=5m

      - name: Wait for redis rollout
        # The chart's Bitnami Redis subchart (backs the Dapr pubsub / dws-definitions /
        # actor-statestore Components) installs whenever dapr.enabled=true, per the
        # Chart.yaml condition wired in for Phase 5. Wait for it before asserting the
        # pubsub Component below.
        run: kubectl rollout status statefulset/dws-redis-master -n dws-system --timeout=5m

      - name: Assert pubsub Component present
        run: |
          kubectl get component pubsub -n dws-system
          kubectl get component dws-definitions -n dws-system
          kubectl get component dws-actor-statestore -n dws-system

      - name: End-to-end pubsub delivery check
        # Proves the chart-managed `pubsub` Component actually carries traffic
        # WITHOUT injecting any new daprd sidecars — kind's Dapr control plane
        # (sentry/operator/sidecar-injector) flaps under this runner's resource
        # limits, so any test that requires the injector to touch a fresh pod is
        # unreliable (previous runs failed with "daprd sidecar was not injected
        # after retry" while sentry logged 503 liveness). Instead, exercise the
        # admin pod's already-injected, already-Ready daprd sidecar via a
        # port-forward from the runner:
        #   1. Confirm each Component is present in-cluster.
        #   2. Confirm admin's daprd logged its subscription registration on the
        #      `pubsub` component + `dws.events` topic — proves the Component
        #      loaded correctly and Dapr routed the Subscription CRD.
        #   3. Publish two real DWS lifecycle events (per docs/events.md) through
        #      admin's daprd sidecar; a 2xx from the pubsub API is proof the
        #      Component accepted the message and wrote to the Redis stream.
        # Delivery-to-consumer is exercised end-to-end in each Java component's
        # own test suite — not here, per the Phase 5 spec's transport-only scope.
        run: |
          set -euo pipefail
          NS=dws-system

          echo "--- Components present ---"
          kubectl get component pubsub -n "$NS"
          kubectl get component dws-definitions -n "$NS"
          kubectl get component dws-actor-statestore -n "$NS"

          echo "--- admin subscription registration and pubsub initialization ---"
          # Dapr 1.18 does not emit a subscription-registration log line. Verify
          # the app's registration and the sidecar's pubsub Component separately.
          kubectl logs -n "$NS" -l app.kubernetes.io/component=admin -c admin --tail=500 \
            | grep -F '[Topic = dws.events] Registered Subscription with routes: default' \
            || { echo "::error::admin never registered the dws.events subscription"; exit 1; }
          kubectl logs -n "$NS" -l app.kubernetes.io/component=admin -c daprd --tail=500 \
            | grep -F 'Component loaded: pubsub (pubsub.redis/v1)' \
            || { echo "::error::admin daprd never loaded the pubsub Component"; exit 1; }

          echo "--- publish real events via admin's daprd sidecar ---"
          # daprd's HTTP API (port 3500) binds to 127.0.0.1 / [::1] only for
          # security, so port-forward to svc/dws-admin-dapr:80 can't reach it
          # ("lost connection to pod"). Use `kubectl debug` to add an ephemeral
          # curl container that SHARES the admin pod's network namespace via
          # --target=admin — from inside that container, localhost:3500 is
          # daprd's loopback listener. No security posture change, no fresh
          # sidecar injection required.
          admin_pod=$(kubectl get pods -n "$NS" -l app.kubernetes.io/component=admin -o jsonpath='{.items[0].metadata.name}')
          [ -n "$admin_pod" ] || { echo "::error::no admin pod found"; exit 1; }
          echo "admin pod: $admin_pod"

          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          DEF_ID="e2e-def-$(date +%s)-$RANDOM"
          INST_ID="e2e-inst-$(date +%s)-$RANDOM"

          publish() {
            local id="$1"; local type="$2"; local source="$3"; local data="$4"
            local body
            body=$(printf '{"id":"%s","source":"%s","type":"%s","time":"%s","datacontenttype":"application/json","data":%s}' \
              "$id" "$source" "$type" "$NOW" "$data")
            echo "publishing $type id=$id"
            kubectl debug -n "$NS" "$admin_pod" -q -i \
              --image=curlimages/curl:8.11.1 \
              --target=admin \
              -- sh -c "curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' -d '$body' http://localhost:3500/v1.0/publish/pubsub/dws.events"
          }

          publish "$DEF_ID"  "io.dws.definition.created" "dws-controller" \
            "{\"workflow\":\"order\",\"version\":\"vpubsube2e\",\"createdAt\":\"$NOW\"}"

          publish "$INST_ID" "io.dws.instance.started"   "dws-orchestrator/order" \
            "{\"instanceId\":\"inst-e2e\",\"workflow\":\"order\",\"version\":\"vpubsube2e\",\"appId\":\"order\",\"startedAt\":\"$NOW\"}"

          echo "pubsub e2e confirmed: components present, admin subscribed to dws.events, and both real lifecycle events were accepted by pubsub Component"

      - name: Debug pod state on failure
        if: failure()
        run: |
          kubectl get pods -n dws-system -o wide
          kubectl get events -n dws-system --sort-by=.lastTimestamp
          kubectl describe pods -n dws-system -l app.kubernetes.io/component=admin
          kubectl describe pods -n dws-system -l app.kubernetes.io/name=postgresql
          echo "--- admin pod logs, all containers (current) ---"
          kubectl logs -n dws-system -l app.kubernetes.io/component=admin --all-containers --prefix --tail=200 || true
          echo "--- admin pod logs, all containers (previous, if crashlooping) ---"
          kubectl logs -n dws-system -l app.kubernetes.io/component=admin --all-containers --prefix --previous --tail=200 || true
          echo "--- dapr pods (dws-system) ---"
          kubectl get pods -n dws-system -l app.kubernetes.io/name=dapr -o wide || true
          echo "--- dapr-ready-hook job logs ---"
          kubectl logs -n dws-system -l app.kubernetes.io/component=dapr-ready-hook --all-containers --prefix --tail=200 || true
          echo "--- redis pod state ---"
          kubectl describe statefulset/dws-redis-master -n dws-system || true
          kubectl logs -n dws-system -l app.kubernetes.io/name=redis --all-containers --prefix --tail=200 || true
          echo "--- dapr Components (dws-system) ---"
          kubectl get components -n dws-system -o wide || true
          kubectl describe component pubsub -n dws-system || true
          echo "--- pubsub e2e pods ---"
          kubectl get pods -n dws-system -l 'app.kubernetes.io/name!=redis' -o wide | grep pubsub-e2e || true
          kubectl logs pubsub-e2e-publisher -n dws-system --all-containers --prefix --tail=200 || true
          kubectl logs pubsub-e2e-subscriber -n dws-system --all-containers --prefix --tail=200 || true

      - name: Run helm test
        run: helm test dws --namespace dws-system --logs

  integration-dapr-preinstalled:
    name: install with dapr.enabled=false against a pre-installed Dapr
    runs-on: ubuntu-latest
    needs: verify
    # dapr.enabled=false means "Dapr is already installed in this cluster" (an
    # operator running a shared, externally-managed Dapr control plane), not "don't
    # use Dapr" — dws-admin still needs dapr.enabled=true at install time to get its
    # sidecar annotations (see the `integration` job above). What this leg actually
    # proves: with that toggle off, the chart does not try to install its own Dapr
    # dependency, and the preflight check passes when Dapr is genuinely present —
    # not a full admin rollout.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Fetch chart dependencies
        run: helm dependency update ${{ env.CHART_DIR }}

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install Dapr control plane out-of-band
        run: |
          wget -q https://raw.githubusercontent.com/dapr/cli/master/install/install.sh -O - | /bin/bash
          dapr init -k --wait --timeout 300

      - name: Install chart with dapr.enabled=false
        # Everything else disabled too: this leg only exercises the preflight
        # check's "Dapr present" pass-through and confirms no Dapr subchart
        # resources get installed by the chart itself.
        run: |
          helm install dws ${{ env.CHART_DIR }} \
            --namespace dws-system --create-namespace \
            --set controller.enabled=false \
            --set admin.enabled=false \
            --set postgresql.enabled=false \
            --set dapr.enabled=false \
            --timeout 2m

      - name: Verify no chart-installed Dapr resources
        run: |
          if kubectl get pods -n dws-system -l app.kubernetes.io/name=dapr 2>/dev/null | grep -q .; then
            echo "::error::dapr.enabled=false but the chart installed Dapr resources anyway"
            exit 1
          fi

  integration-oauth-path-filter:
    name: OAuth pathFilter with Dapr ${{ inputs.dapr_version || '1.18.1' }}
    runs-on: ubuntu-latest
    needs: verify
    # This deliberately uses an isolated Dapr release instead of the full chart install: no
    # published controller/runner image is needed to prove Dapr's appHttpPipeline behavior. The
    # fixture applies the same version-scoped resource shape StackSynthesizer emits for a step.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Verify OAuth endpoint path isolation
        run: bash ./scripts/verify-dapr-oauth-path-filter.sh

  integration-gateway-sse:
    name: live SSE over Gateway/APISIX/Dapr invoke (auth roadmap §2b/§2c)
    runs-on: ubuntu-latest
    needs: verify
    # Closes the deferred live-verification item in openspec/changes/api-gateway/verify.md
    # section 5: proves an SSE stream actually survives Gateway -> APISIX -> Dapr service
    # invocation -> Nest, with Dapr's bearer middleware as the sole JWT verifier, end to end,
    # plus the bundled-mode bearer matrix and console/admin route precedence. Builds
    # dws-admin/dws-console from THIS checkout (not a published image) so the run exercises this
    # branch's own application code, not whatever tag happens to be on ghcr.io.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install Dapr control plane
        # scripts/verify-gateway-sse-path.sh deliberately never installs its own Dapr control
        # plane (dapr.enabled=false throughout, to avoid a second cluster-scoped
        # sidecar-injector webhook) -- install one here instead, exactly as it expects.
        run: |
          helm repo add dapr https://dapr.github.io/helm-charts/ --force-update
          helm repo update dapr
          helm upgrade --install dapr dapr/dapr \
            --namespace dapr-system --create-namespace \
            --version "${{ env.DAPR_VERSION }}" --wait --timeout 5m

      - name: Verify live Gateway -> APISIX -> Dapr invoke -> Nest SSE path
        run: bash ./scripts/verify-gateway-sse-path.sh

  release:
    name: package & push (OCI)
    # Publish only on merge to the default branch — PRs verify but never push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A chart release must also have passed the live Dapr OAuth path-isolation probe and the
    # live Gateway/APISIX/Dapr-invoke SSE probe. Without this dependency GitHub could publish
    # after `verify` succeeded while either independent live probe failed.
    needs: [verify, integration-oauth-path-filter, integration-gateway-sse]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need Chart.yaml's previous committed state (HEAD^) to detect a version
          # bump below — a normal depth-1 checkout doesn't have it.
          fetch-depth: 2

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package ${{ env.CHART_DIR }} --destination /tmp/chart

      - name: Push chart to OCI registry
        run: |
          chart_pkg=$(ls /tmp/chart/*.tgz)
          echo "Pushing $chart_pkg to oci://${{ env.OCI_REGISTRY }}"
          helm push "$chart_pkg" "oci://${{ env.OCI_REGISTRY }}"

      - name: Detect chart version bump
        # A GitHub Release only targets the chart, not every component image — it
        # marks "this Chart.yaml version is now published", not every merge to
        # main. Compare Chart.yaml's version field against its previous committed
        # state; only a real bump (e.g. 0.1.0 -> 1.0.0) should cut a release.
        id: chart_version
        run: |
          new_version=$(grep -m1 '^version:' ${{ env.CHART_DIR }}/Chart.yaml | awk '{print $2}')
          old_version=$(git show HEAD^:${{ env.CHART_DIR }}/Chart.yaml 2>/dev/null | grep -m1 '^version:' | awk '{print $2}' || echo "")
          echo "new=$new_version" >> "$GITHUB_OUTPUT"
          if [ "$new_version" != "$old_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and create GitHub Release
        if: steps.chart_version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.chart_version.outputs.new }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "::notice::$tag already exists on origin — skipping release creation"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          chart_pkg=$(ls /tmp/chart/*.tgz)
          gh release create "$tag" "$chart_pkg" \
            --title "dws chart $tag" \
            --generate-notes
