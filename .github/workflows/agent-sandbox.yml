name: agent-sandbox

on:
  push:
    branches: [main]
    paths:
      - 'agent-sandbox/**'
      - '.github/workflows/agent-sandbox.yml'
  pull_request:
    paths:
      - 'agent-sandbox/**'
      - '.github/workflows/agent-sandbox.yml'
  workflow_dispatch:

concurrency:
  group: agent-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dws-agent-sandbox
  VALIDATE_TAG: dws-agent-sandbox:validate

jobs:
  validate:
    name: build image & run component CI gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile's own smoke-test RUN step fails this build if any
      # toolchain (java/go/node/pnpm/jq/gh/claude/codex/openspec/openwiki and Superpowers plugins)
      # is missing or the wrong version.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: agent-sandbox
          tags: ${{ env.VALIDATE_TAG }}
          load: true
          cache-from: type=gha,scope=agent-sandbox
          cache-to: type=gha,mode=max,scope=agent-sandbox

      # Real per-component CI-gate commands, run inside the built image against
      # this checkout -- proves the sandbox toolchain can actually do the job,
      # not just that the binaries exist.
      - name: dws-controller -- ./mvnw verify
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/dws-controller \
            ${{ env.VALIDATE_TAG }} ./mvnw -B -ntp verify

      - name: dws-orchestrator -- ./mvnw verify
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/dws-orchestrator \
            ${{ env.VALIDATE_TAG }} ./mvnw -B -ntp verify

      - name: dws-call-http -- make vet && make test
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/dws-call-http \
            ${{ env.VALIDATE_TAG }} sh -c "make vet && make test"

      - name: dws-run -- make vet && make test
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/dws-run \
            ${{ env.VALIDATE_TAG }} sh -c "make vet && make test"

      - name: dws-call-openapi -- pnpm lint && pnpm test && pnpm build
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/dws-call-openapi \
            ${{ env.VALIDATE_TAG }} sh -c "pnpm install --frozen-lockfile && pnpm lint && pnpm test && pnpm build"

  build-image:
    name: build & push image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Skip on PRs: the image is built for validation but not pushed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent-sandbox
          # Build on PRs to validate the Dockerfile; only push on merge to main.
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-sandbox
          cache-to: type=gha,mode=max,scope=agent-sandbox
