name: dws-flow

on:
  push:
    branches: [main]
    tags:
      - 'dws-flow-v*'
    paths:
      - 'dws-flow/**'
      - '.github/workflows/dws-flow.yml'
  pull_request:
    paths:
      - 'dws-flow/**'
      - '.github/workflows/dws-flow.yml'
  workflow_dispatch:

concurrency:
  group: dws-flow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dws-flow

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dws-flow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The test project is named explicitly on purpose. A bare `dotnet test` in
      # dws-flow/ only sees dws-flow.csproj (the app), which has no tests and
      # excludes test/** from compilation, so it restores, runs nothing and exits 0.
      - name: Test
        run: dotnet test test/dws-flow.Tests.csproj --configuration Release

  build-image:
    name: build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Skip on PRs: the image is built for validation but not pushed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=^dws-flow-v(.*)$,group=1
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Loaded into the local daemon rather than pushed, so the next step can
      # run the very image that would ship.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: dws-flow
          load: true
          tags: dws-flow:smoke
          cache-from: type=gha,scope=dws-flow
          cache-to: type=gha,mode=max,scope=dws-flow

      # The service needs a pinned single-node definition at startup and exits if
      # it is missing or invalid. It does not need a Dapr sidecar to boot: the
      # workflow worker logs gRPC failures and keeps retrying while Kestrel serves
      # /healthz. Require that answer.
      - name: Smoke-test the image
        run: |
          dir=$(mktemp -d)
          cat > "$dir/definition.json" <<'JSON'
          {
            "workflow": "smoke",
            "version": "smoke@v1",
            "nodeId": "smoke-main",
            "kind": "flow",
            "scope": "main",
            "tasks": [ { "validateOrder": { "set": { "validated": true } } } ],
            "children": { "validateOrder": "validate-order" }
          }
          JSON
          chmod -R a+rX "$dir"
          docker run -d --name dws-flow-smoke -p 8080:8080 \
            -v "$dir:/definition:ro" \
            -e DWS_FLOW_DEFINITION_PATH=/definition/definition.json \
            dws-flow:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; break; fi
            if [ "$i" -eq 30 ]; then
              echo "container did not become healthy"; docker logs dws-flow-smoke; exit 1
            fi
            sleep 2
          done
          docker rm -f dws-flow-smoke

      # Fully cached by the build above, so this re-tags and uploads rather
      # than rebuilding. Skipped on PRs — validated there, published on merge.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: dws-flow
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dws-flow
