document:
  dsl: 1.0.0
  namespace: examples
  name: try-order-workflow
  version: '1.0.0'
use:
  retries:
    # Referenced by name from guarded's catch, proving use.retries resolution.
    thrice:
      delay:
        seconds: 2
      backoff:
        exponential: {}
      limit:
        attempt:
          count: 3
do:
  # Catches only a 503 communication failure, retries it three times with exponential
  # backoff, then recovers. `as: failure` proves the error variable is renameable.
  - guarded:
      try:
        - fetchOrder:
            call: http
            with:
              method: get
              endpoint: http://order-service/run
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/dsl/errors/types/communication
            status: 503
        as: failure
        retry: thrice
        do:
          - recordFailure:
              set:
                recovered: '"yes"'
                reason: '$failure.detail'
  - finish:
      set:
        done: '"yes"'
