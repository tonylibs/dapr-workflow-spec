# Example Knative Service for a single jq expression site.
#
# This manifest configures the `processItems.jq.while` site: the `while`
# condition of a `for` loop. Every expression site deploys this same image and
# differs only in the env block and the Dapr app-id. The controller renders
# these (roadmap row 2m.2); this file is a hand-written reference.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: processitems-jq-while
  labels:
    dws.io/step-type: jq
    dws.io/task: processitems-jq-while
spec:
  template:
    metadata:
      annotations:
        # WARNING: with minScale "0", Dapr-invoked callers FAIL once the revision has scaled to
        # zero. Dapr service invocation cannot wake it: with no pod there is no
        # <app-id>-dapr Service address, and every call fails at once with HTTP 500
        # ERR_DIRECT_INVOKE ("no such host"); measured 5 of 5 in EX-3 (README "EX-3 results",
        # ADR 0014 "2j notes"). Only a request through the Knative route scales it up.
        # "0" is kept here as a reference value, not a recommendation: the scale policy for
        # expression functions is decided in roadmap row 2.0d / O-1, not by this file.
        autoscaling.knative.dev/minScale: "0"
        # Dapr sidecar injection. Callers reach the function through Dapr
        # service invocation: POST /v1.0/invoke/processitems-jq-while/method/run
        dapr.io/enabled: "true"
        dapr.io/app-id: "processitems-jq-while"
        dapr.io/app-port: "8080"
        # Knative's queue-proxy uses Dapr's default metrics port (9090).
        dapr.io/metrics-port: "9095"
    spec:
      containers:
        - image: registry.io/dws/dws-jq:1.0
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: JQ_EXPRESSION
              value: '$item < 3'
            - name: JQ_VARIABLES
              value: '["context","item","index"]'
            - name: JQ_SITE
              value: 'processItems.jq.while'
            # Optional knobs (defaults shown for reference):
            # - name: JQ_TIMEOUT
            #   value: "5s"             # per-evaluation limit, a Go duration > 0
            # - name: JQ_SECRET_STORE
            #   value: "kubernetes"     # required when the expression reads $secrets
            # - name: DWS_LOG_FORMAT
            #   value: "json"           # structured logs (docs/log-format.md)
          # Ready only once the expression compiled and its secrets were read.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          # No livenessProbe: /healthz answers 503 while secrets are still being
          # read (up to 60 s), and a liveness failure there would restart the pod.
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
