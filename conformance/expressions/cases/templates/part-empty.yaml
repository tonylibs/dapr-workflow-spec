name: templates/part-empty
test: givenPartWithNoOutput_whenEvaluated_thenPartIsNull
area: templates
summary: 'A part that produces nothing becomes null while the rest of the object is kept.'
source: 'ADR 0014 Decision 9, O-2 (the compiler wraps each ${ } part as ([ expr ] | .[0])).'
expression: '{ "a": ([ empty ] | .[0]), "b": 1 }'
input: null
expect: { result: {"a":null,"b":1}, truthy: true }
