name: templates/part-as
test: givenPartWithAsBinding_whenEvaluated_thenBindingStaysInsidePart
area: templates
summary: 'A part that binds with as $x keeps the binding inside the part.'
source: 'ADR 0014 Decision 9, O-2 (the compiler wraps each ${ } part as ([ expr ] | .[0])).'
expression: '{ "a": ([ .n as $x | $x * $x ] | .[0]), "b": ([ .n ] | .[0]) }'
input: {"n":3}
expect: { result: {"a":9,"b":3}, truthy: true }
