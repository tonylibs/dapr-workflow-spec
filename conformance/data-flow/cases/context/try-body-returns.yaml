name: context/try-body-returns
test: givenExportInsideTryBody_whenTryCompletes_thenContextReturnsToParent
area: context
summary: A context exported inside a try body is returned to the try's parent scope.
source: ADR 0012 Decision 5 (try body). OWS 1.0.0 is silent on context across try scopes.
uses: [set, try]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: try-body-returns, version: '1.0.0' }
  do:
    - guarded:
        try:
          - inside:
              set:
                value: '${ .value }'
              export:
                as: '${ { fromTry: .value } }'
        catch:
          errors:
            with:
              type: https://example.com/errors/never-raised
    - after:
        set:
          value: '${ .value }'
        output:
          as: '${ { value: .value, seen: $context } }'
input: { value: 1 }
expect:
  output: { value: 1, seen: { fromTry: 1 } }
  context: { fromTry: 1 }
