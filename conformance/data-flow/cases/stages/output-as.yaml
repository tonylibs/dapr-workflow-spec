name: stages/output-as
area: stages
summary: output.as alone (string form) reshapes the body's output into the task's output.
source: workflow-data-flow spec, scenarios "String form transforms the whole document" and "Output transform flows to the next task".
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: output-as, version: '1.0.0' }
  do:
    - total:
        set:
          orderId: '${ .orderId }'
          price: '${ .price }'
          qty: '${ .qty }'
          total: '${ .price * .qty }'
        output:
          as: '${ { id: .orderId, total: .total } }'
input: { orderId: o-1, price: 5, qty: 3 }
expect:
  output: { id: o-1, total: 15 }
  context: {}
