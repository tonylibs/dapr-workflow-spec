name: faults/export-as-expression
area: faults
summary: An export.as expression that fails at evaluation faults the task, naming the task and the export phase.
source: workflow-data-flow spec, requirement "Minimal data-flow fault signal"; ADR 0012 Decision 7.
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: export-as-expression, version: '1.0.0' }
  do:
    - remember:
        set:
          name: '${ .name }'
        export:
          as: '${ { upper: (.name | ascii_downcase | tonumber) } }'
input: { name: Alice }
expect:
  fault: { task: remember, phase: export }
