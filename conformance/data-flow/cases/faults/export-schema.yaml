name: faults/export-schema
area: faults
summary: A non-conforming exported context faults the task in the export phase, naming the offending location.
source: OWS 1.0.0 dsl.md Data Flow step 8; workflow-data-flow spec, requirement "Minimal data-flow fault signal".
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: export-schema-fault, version: '1.0.0' }
  do:
    - remember:
        set:
          reference: '${ .reference }'
        export:
          as: '${ { charged: .reference } }'
          schema:
            format: json
            document:
              type: object
              properties:
                charged: { type: string }
input: { reference: 17 }
expect:
  fault: { task: remember, phase: export, location: /charged }
