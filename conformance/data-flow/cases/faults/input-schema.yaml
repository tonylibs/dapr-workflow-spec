name: faults/input-schema
test: givenNonConformingInput_whenTaskRuns_thenFaultNamesInputPhaseAndLocation
area: faults
summary: A non-conforming input faults the task in the input phase, naming the offending location.
source: workflow-data-flow spec, scenarios "Non-conforming document fails the task" and "Validation failure names the offending field"; ADR 0012 Decision 7.
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: input-schema-fault, version: '1.0.0' }
  do:
    - charge:
        input:
          schema:
            format: json
            document:
              type: object
              properties:
                amount: { type: number }
              required: [amount]
        set:
          amount: '${ .amount }'
input: { amount: ten }
expect:
  fault: { task: charge, phase: input, location: /amount }
