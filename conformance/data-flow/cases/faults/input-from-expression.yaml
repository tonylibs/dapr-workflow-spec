name: faults/input-from-expression
area: faults
summary: An input.from expression that fails at evaluation faults the task, naming the task and the input phase.
source: workflow-data-flow spec, requirement "Minimal data-flow fault signal"; ADR 0012 Decision 7.
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: input-from-expression, version: '1.0.0' }
  do:
    - convert:
        input:
          from: '${ { amount: (.amount + "x") } }'
        set:
          amount: '${ .amount }'
input: { amount: 1 }
expect:
  fault: { task: convert, phase: input }
