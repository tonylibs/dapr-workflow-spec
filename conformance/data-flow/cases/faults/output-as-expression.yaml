name: faults/output-as-expression
test: givenFailingOutputAs_whenTaskCompletes_thenFaultNamesTaskAndOutputPhase
area: faults
summary: An output.as expression that fails at evaluation faults the task, naming the task and the output phase.
source: workflow-data-flow spec, requirement "Minimal data-flow fault signal"; ADR 0012 Decision 7.
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: output-as-expression, version: '1.0.0' }
  do:
    - shape:
        set:
          items: '${ .items }'
        output:
          as: '${ { first: (.items | keys) } }'
input: { items: 3 }
expect:
  fault: { task: shape, phase: output }
