name: unsupported/export-schema-external
area: unsupported
summary: An external export.schema resource fails the task in the export phase, naming the external form.
source: workflow-data-flow spec, scenario "Unsupported schema form is rejected"; ADR 0012 Decision 8.
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: export-schema-external, version: '1.0.0' }
  do:
    - remember:
        set:
          id: '${ .id }'
        export:
          as: '${ { id: .id } }'
          schema:
            format: json
            resource:
              endpoint: https://schemas.example.com/context.json
input: { id: o-1 }
expect:
  fault: { task: remember, phase: export, detailContains: [external] }
