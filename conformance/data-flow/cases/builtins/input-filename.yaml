name: builtins/input-filename
area: builtins
summary: 'The `input_filename` builtin is blocked; using it in output faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: reads outside the document).'
engine: 'jackson-jq 1.2.0 does not implement `input_filename`; the expression already fails to compile ("Function input_filename/0 does not exist").'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-input-filename, version: '1.0.0' }
  do:
    - probe:
        set:
          value: '${ .value }'
        output:
          as: '${ { file: input_filename } }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: output, detailContains: ['input_filename'] }
