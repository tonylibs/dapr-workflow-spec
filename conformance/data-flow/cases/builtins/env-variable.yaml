name: builtins/env-variable
area: builtins
summary: 'The `$ENV` builtin is blocked; using it in input faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: exposes the pod''s environment).'
engine: 'jackson-jq 1.2.0 does not implement `$ENV`; the expression already fails to compile ("$ENV is not defined").'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-env-variable, version: '1.0.0' }
  do:
    - probe:
        input:
          from: '${ { home: $ENV.HOME } }'
        set:
          value: '${ .value }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: input, detailContains: ['$ENV'] }
