name: builtins/env
test: givenEnvBuiltin_whenOutputAsEvaluates_thenFaultNamesBuiltin
area: builtins
summary: 'The `env` builtin is blocked; using it in output faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: exposes the pod''s environment).'
engine: 'jackson-jq 1.2.0 does not implement `env`; the expression already fails to compile ("Function env/0 does not exist").'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-env, version: '1.0.0' }
  do:
    - probe:
        set:
          value: '${ .value }'
        output:
          as: '${ { home: env.HOME } }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: output, detailContains: ['env'] }
