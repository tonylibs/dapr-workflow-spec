name: builtins/halt-error
area: builtins
summary: 'The `halt_error` builtin is blocked; using it in output faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: terminates the evaluator).'
engine: 'jackson-jq 1.2.0 does not implement `halt_error`; the expression already fails to compile ("Function halt_error/0 does not exist").'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-halt-error, version: '1.0.0' }
  do:
    - probe:
        set:
          value: '${ .value }'
        output:
          as: '${ "stop" | halt_error }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: output, detailContains: ['halt_error'] }
