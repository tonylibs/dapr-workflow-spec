name: builtins/halt
area: builtins
summary: 'The `halt` builtin is blocked; using it in export faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: terminates the evaluator).'
engine: 'jackson-jq 1.2.0 does not implement `halt`; the expression already fails to compile ("Function halt/0 does not exist").'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-halt, version: '1.0.0' }
  do:
    - probe:
        set:
          value: '${ .value }'
        export:
          as: '${ halt }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: export, detailContains: ['halt'] }
