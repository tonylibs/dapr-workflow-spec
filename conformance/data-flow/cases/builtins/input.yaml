name: builtins/input
test: givenInputBuiltin_whenExportAsEvaluates_thenFaultNamesBuiltin
area: builtins
summary: 'The `input` builtin is blocked; using it in export faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: reads outside the document).'
engine: 'jackson-jq 1.2.0 does not implement `input`; the expression already fails to compile ("Function input/0 does not exist").'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-input, version: '1.0.0' }
  do:
    - probe:
        set:
          value: '${ .value }'
        export:
          as: '${ { next: input } }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: export, detailContains: ['input'] }
