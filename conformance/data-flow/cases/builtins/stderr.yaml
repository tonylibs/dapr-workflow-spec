name: builtins/stderr
test: givenStderrBuiltin_whenExportAsEvaluates_thenFaultNamesBuiltin
area: builtins
summary: 'The `stderr` builtin is blocked; using it in export faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: writes workflow data to logs).'
engine: 'jackson-jq 1.2.0 does not implement `stderr`; the expression already fails to compile ("Function stderr/0 does not exist").'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-stderr, version: '1.0.0' }
  do:
    - probe:
        set:
          value: '${ .value }'
        export:
          as: '${ { value: (.value | stderr) } }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: export, detailContains: ['stderr'] }
