name: builtins/debug
area: builtins
summary: 'The `debug` builtin is blocked; using it in output faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: writes workflow data to logs).'
engine: 'jackson-jq 1.2.0 does not implement `debug`; the expression already fails to compile ("Function debug/0 does not exist"). It has an unrelated `debug_scope/0` extension, which is not on the block list.'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-debug, version: '1.0.0' }
  do:
    - probe:
        set:
          value: '${ .value }'
        output:
          as: '${ { value: (.value | debug) } }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: output, detailContains: ['debug'] }
