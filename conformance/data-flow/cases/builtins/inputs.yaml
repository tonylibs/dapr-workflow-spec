name: builtins/inputs
test: givenInputsBuiltin_whenOutputAsEvaluates_thenFaultNamesBuiltin
area: builtins
summary: 'The `inputs` builtin is blocked; using it in output faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: reads outside the document).'
engine: 'jackson-jq 1.2.0 does not implement `inputs`; the expression already fails to compile ("Function inputs/0 does not exist").'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-inputs, version: '1.0.0' }
  do:
    - probe:
        set:
          value: '${ .value }'
        output:
          as: '${ { rest: [inputs] } }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: output, detailContains: ['inputs'] }
