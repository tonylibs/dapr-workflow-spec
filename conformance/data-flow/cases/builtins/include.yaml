name: builtins/include
test: givenIncludeDirective_whenOutputAsEvaluates_thenFaultNamesBuiltin
area: builtins
summary: 'The `include` builtin is blocked; using it in output faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: loads modules from disk).'
engine: 'jackson-jq 1.2.0 parses `include` but has no module loader configured, so it fails with "module not found: helpers" before any disk access.'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-include, version: '1.0.0' }
  do:
    - probe:
        set:
          value: '${ .value }'
        output:
          as: '${ include "helpers"; { value: .value } }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: output, detailContains: ['include'] }
