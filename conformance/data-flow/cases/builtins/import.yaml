name: builtins/import
test: givenImportDirective_whenInputFromEvaluates_thenFaultNamesBuiltin
area: builtins
summary: 'The `import` builtin is blocked; using it in input faults the task, naming the builtin.'
source: 'ADR 0012 Decision 9 (blocked: loads modules from disk).'
engine: 'jackson-jq 1.2.0 parses `import` but has no module loader configured, so it fails with "module not found: secrets" before any disk access.'
uses: [set]
workflow:
  document: { dsl: '1.0.0', namespace: conformance, name: builtin-import, version: '1.0.0' }
  do:
    - probe:
        input:
          from: '${ import "secrets" as s; { value: .value } }'
        set:
          value: '${ .value }'
input: { value: 1 }
expect:
  fault: { task: probe, phase: input, detailContains: ['import'] }
