dws:
  # Namespace the controller deploys managed workflow stacks into.
  namespace: default
  # How often drained previous versions are garbage-collected.
  reconcile:
    every: 30s
  orchestrator:
    # ServiceAccount orchestrator pods run as; needs configmaps get/list/watch (the definition
    # Component reads its ConfigMap as the pod's service account). Env: DWS_ORCHESTRATOR_SERVICE_ACCOUNT.
    service-account: dws-orchestrator
  # Prebuilt step/orchestrator images. Override registry and tags per environment.
  images:
    call-http: ghcr.io/tonylibs/dws-call-http:latest
    call-openapi: ghcr.io/tonylibs/dws-call-openapi:latest
    call-grpc: ghcr.io/tonylibs/dws-call-grpc:latest
    call-asyncapi: ghcr.io/tonylibs/dws-call-asyncapi:latest
    call-a2a: ghcr.io/tonylibs/dws-call-a2a:latest
    run-shell: ghcr.io/tonylibs/dws-run-shell:latest
    run-script-js: ghcr.io/tonylibs/dws-run-script-js:latest
    run-script-python: ghcr.io/tonylibs/dws-run-script-python:latest
    orchestrator: ghcr.io/tonylibs/dws-orchestrator:latest

quarkus:
  kubernetes-client:
    devservices:
      enabled: false
