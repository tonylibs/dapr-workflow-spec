apiVersion: v1
kind: ServiceAccount
metadata:
  name: dws-controller
  namespace: default
  labels:
    app: dws-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dws-controller
  namespace: default
  labels:
    app: dws-controller
rules:
  # Immutable definition ConfigMaps. `deletecollection` is required on every managed kind:
  # the controller removes a workflow or a drained version with label-selector deletes, which
  # the API server authorizes as a collection DELETE (fabric8 withLabels(...).delete()).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete", "deletecollection"]
  # Orchestrator Deployments. `update`/`patch` are needed to stamp dws.io/drain=true on
  # the superseded version during rollout.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "deletecollection", "update", "patch"]
  # Step services. `update`/`patch` let a new version re-label an existing, same-named
  # Knative Service instead of failing on create.
  - apiGroups: ["serving.knative.dev"]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete", "deletecollection", "update", "patch"]
  # Dapr resources the controller applies per workflow version: the definition-store and
  # binding/middleware Components, the OAuth HTTPEndpoints and sidecar Configurations, and
  # the per-step WorkflowAccessPolicies (ResourceContexts in dws-controller).
  - apiGroups: ["dapr.io"]
    resources: ["components"]
    verbs: ["get", "list", "create", "delete", "deletecollection", "update", "patch"]
  - apiGroups: ["dapr.io"]
    resources: ["httpendpoints"]
    verbs: ["get", "list", "create", "delete", "deletecollection", "update", "patch"]
  - apiGroups: ["dapr.io"]
    resources: ["configurations"]
    verbs: ["get", "list", "create", "delete", "deletecollection", "update", "patch"]
  - apiGroups: ["dapr.io"]
    resources: ["workflowaccesspolicies"]
    verbs: ["get", "list", "create", "delete", "deletecollection", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dws-controller
  namespace: default
  labels:
    app: dws-controller
subjects:
  - kind: ServiceAccount
    name: dws-controller
    namespace: default
roleRef:
  kind: Role
  name: dws-controller
  apiGroup: rbac.authorization.k8s.io
---
# Identity for controller-compiled orchestrator pods (the controller stamps this name on every
# orchestrator Deployment via DWS_ORCHESTRATOR_SERVICE_ACCOUNT). Each workflow version has a
# `configuration.kubernetes` Dapr Component backed by its definition ConfigMap, and daprd reads
# that ConfigMap with the pod's service account; `default` has no grant, so without this the
# sidecar crash-loops on "failed to sync informer cache for ConfigMap".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dws-orchestrator
  namespace: default
  labels:
    app: dws-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dws-orchestrator
  namespace: default
  labels:
    app: dws-orchestrator
rules:
  # Read-only. Namespace-wide because definition ConfigMaps are created per version at runtime,
  # so a static Role cannot name them with resourceNames.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dws-orchestrator
  namespace: default
  labels:
    app: dws-orchestrator
subjects:
  - kind: ServiceAccount
    name: dws-orchestrator
    namespace: default
roleRef:
  kind: Role
  name: dws-orchestrator
  apiGroup: rbac.authorization.k8s.io
