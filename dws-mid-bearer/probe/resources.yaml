# Resources for probe/verify.sh. Mirrors what OWS 4.1d will emit per (endpoint,
# policy): an HTTPEndpoint, a composed guestConfig Secret, a wasm Component that
# reads it by secretKeyRef, one Configuration, and a step pod whose init container
# copies /bearer.wasm into an emptyDir that daprd mounts. Placeholders in
# @UPPER@ form are substituted by verify.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caller-empty
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guest-config-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [bearer-guest-config, empty-guest-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guest-config-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guest-config-reader
subjects:
  - kind: ServiceAccount
    name: caller
  - kind: ServiceAccount
    name: caller-empty
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            values = self.headers.get_all("Authorization") or []
            authorization = "|".join(values) if values else "<none>"
            print(f"path={self.path} authorization={authorization}", flush=True)
            self.send_response(200)
            self.end_headers()
            self.wfile.write(authorization.encode())

    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: python:3.13-alpine
          command: [python, /app/server.py]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: source
              mountPath: /app
      volumes:
        - name: source
          configMap:
            name: echo
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector:
    app: echo
  ports:
    - port: 8080
      targetPort: 8080
---
# bearer-target is the endpoint the guest is configured for; other-target points
# at the same server and must receive no credential from the same pod.
apiVersion: dapr.io/v1alpha1
kind: HTTPEndpoint
metadata:
  name: bearer-target
spec:
  baseUrl: http://echo.@NAMESPACE@.svc.cluster.local:8080
scopes: [caller, caller-empty]
---
apiVersion: dapr.io/v1alpha1
kind: HTTPEndpoint
metadata:
  name: other-target
spec:
  baseUrl: http://echo.@NAMESPACE@.svc.cluster.local:8080
scopes: [caller, caller-empty]
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: bearer-auth
spec:
  type: middleware.http.wasm
  version: v1
  metadata:
    - name: url
      value: file:///mnt/dws-wasm/bearer.wasm
    - name: guestConfig
      secretKeyRef:
        name: bearer-guest-config
        key: guestConfig
auth:
  secretStore: kubernetes
scopes: [caller]
---
# Deliberately broken: the token is empty. 4.1d must NOT set ignoreErrors on
# the real Component (it would let daprd skip a handler that failed to load).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: empty-auth
spec:
  type: middleware.http.wasm
  version: v1
  metadata:
    - name: url
      value: file:///mnt/dws-wasm/bearer.wasm
    - name: guestConfig
      secretKeyRef:
        name: empty-guest-config
        key: guestConfig
auth:
  secretStore: kubernetes
scopes: [caller-empty]
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: caller-cfg
spec:
  httpPipeline:
    handlers:
      - name: bearer-auth
        type: middleware.http.wasm
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: caller-empty-cfg
spec:
  httpPipeline:
    handlers:
      - name: empty-auth
        type: middleware.http.wasm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caller
  template:
    metadata:
      labels:
        app: caller
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: caller
        dapr.io/config: caller-cfg
        dapr.io/sidecar-image: @DAPRD_IMAGE@
        dapr.io/volume-mounts: wasm:/mnt/dws-wasm
        dapr.io/enable-native-sidecar: "false"
    spec:
      serviceAccountName: caller
      initContainers:
        - name: install-wasm
          image: @GUEST_IMAGE@
          imagePullPolicy: @PULL_POLICY@
          command: [cp, /bearer.wasm, /mnt/dws-wasm/bearer.wasm]
          volumeMounts:
            - name: wasm
              mountPath: /mnt/dws-wasm
      containers:
        - name: caller
          image: curlimages/curl:8.11.1
          command: [sh, -ec, "while true; do sleep 3600; done"]
      volumes:
        - name: wasm
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caller-empty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caller-empty
  template:
    metadata:
      labels:
        app: caller-empty
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: caller-empty
        dapr.io/config: caller-empty-cfg
        dapr.io/sidecar-image: @DAPRD_IMAGE@
        dapr.io/volume-mounts: wasm:/mnt/dws-wasm
        dapr.io/enable-native-sidecar: "false"
    spec:
      serviceAccountName: caller-empty
      initContainers:
        - name: install-wasm
          image: @GUEST_IMAGE@
          imagePullPolicy: @PULL_POLICY@
          command: [cp, /bearer.wasm, /mnt/dws-wasm/bearer.wasm]
          volumeMounts:
            - name: wasm
              mountPath: /mnt/dws-wasm
      containers:
        - name: caller
          image: curlimages/curl:8.11.1
          command: [sh, -ec, "while true; do sleep 3600; done"]
      volumes:
        - name: wasm
          emptyDir: {}
